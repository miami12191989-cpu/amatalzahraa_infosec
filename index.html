{n:7,sum:'أمن الشبكات يحمي الأجهزة والخدمات والبيانات من الوصول غير المصرح والاستخدام السيئ والتعديل والتعطيل. التهديدات: البرمجيات الخبيثة (فيروس يحتاج ملفاً مضيفاً، دودة تنتشر ذاتياً، حصان طروادة متنكر)، الهندسة الاجتماعية والتصيد، وهجمات DoS (مصدر واحد) وDDoS (مصادر كثيرة) وتستهدف التوافر. الحماية: الجدار الناري (ALLOW/BLOCK حسب القواعد)، IDS (يكتشف وينبه) وIPS (يكتشف ويحجب)، وتأمين الشبكات السلكية واللاسلكية (WPA3).',
h:`<div class=en><p><b>Learning objectives:</b> Define network security and recognize common security threats. Distinguish malware, social engineering, DoS and DDoS attacks. Explain how firewalls and IDS/IPS help protect networks. Identify basic safeguards for wired and wireless networks.</p>
<h3>1. Network Security Fundamentals</h3><div class=co><b>Network Security:</b> The protection of network devices, services, and data from unauthorized access, misuse, alteration, or disruption.</div><p><b>Why important?</b> Protects information transmitted across networks; limits unauthorized access to devices and services; helps keep networks reliable and available. A firewall controls traffic between the public Internet and the protected internal network.</p>${tb(['CIA principle','Network example'],['Confidentiality: keeps network data private.','Using encryption to protect data sent over a network.'],['Integrity: prevents unauthorized changes.','Detecting changes to a file during transmission.'],['Availability: keeps services accessible.','Using backup servers to keep a university website available if the main server fails.'])}
<h3>2. Security Threats and Common Attacks</h3><p><b>Security Threat:</b> A potential event or condition that could harm a system or its information. <b>Security Attack:</b> An attempt to compromise the security of a system or network.</p>
<h3>2.1 Malware and Its Types</h3><p><b>Malware (Malicious Software):</b> Software designed to harm, disrupt, steal information, or gain unauthorized access. Types include worms, viruses, Trojans, adware, spyware, bots, and ransomware. This lecture focuses on viruses, worms, and Trojans.</p>${tb(['Type','Short definition','Key characteristic'],['Virus','Infects a legitimate file or program and spreads when the infected host runs.','Requires a host program or file.'],['Worm','Self-replicating malware that can spread across networks.','Spreads automatically.'],['Trojan','Malicious software disguised as a legitimate application.','Relies on deception, not self-replication.'])}<p><b>Remember:</b> A Trojan does not self-replicate in the same way as a virus or worm.</p>
<h3>2.2 Social Engineering Attacks</h3><p><b>Social Engineering:</b> Manipulating people into revealing sensitive information or taking unsafe actions.</p><p><b>Phishing:</b> A social engineering attack that uses deceptive messages or websites to trick users into revealing sensitive information or performing unsafe actions. Flow: attacker sends a fake email or link, the user opens a fake login form, and the password is stolen.</p>
<h3>2.3 DoS and DDoS</h3>${bg('DoS vs DDoS',[['DoS','One source overwhelms the target server'],['DDoS','Many compromised devices (botnet) overwhelm the target']])}<p><b>DoS attack:</b> Disrupts a service, often by overwhelming it with requests from a single source. <b>DDoS attack:</b> A DoS attack launched from many sources, often compromised devices (a botnet). DoS originates from one source, while DDoS uses multiple sources. Both mainly threaten network availability.</p>
<h3>3. Network Protection</h3><h3>3.1 Firewalls and Basic Configurations</h3>${fg('Allow rule',['Internet','HTTPS TCP 443: ALLOW','FIREWALL','Internal web server'])}${fg('Block rule',['Internet','Telnet TCP 23: BLOCK','FIREWALL','✖ stopped'])}<p><b>Firewall:</b> A hardware- or software-based control that filters network traffic according to security rules. It allows traffic that meets the rules, blocks traffic that violates them, and uses information such as IP addresses, protocols, and port numbers.</p><p><b>Basic configuration idea:</b> An administrator creates rules that permit or deny traffic. A common safe approach is to deny unapproved inbound traffic by default.</p>${tb(['Sample rule','Action','Reason'],['Incoming HTTPS (TCP 443)','ALLOW','Permit approved web service.'],['Incoming Telnet (TCP 23)','BLOCK','Prevent insecure remote login.'])}
<h3>3.2 Intrusion Detection and Prevention Systems</h3><p><b>IDS:</b> Monitors network or system activity for suspicious events and generates alerts. <b>IPS:</b> Detects suspicious activity and can block malicious traffic automatically.</p>${tb(['Feature','IDS','IPS'],['Main action','Detect and alert','Detect and block'],['Typical placement','Monitoring path','Inline traffic path'])}
<h3>4. Securing Wired and Wireless Networks</h3>${tb(['Wired networks','Wireless networks'],['Restrict physical access to switches and cables.','Use WPA3 or secure WPA2 Wi-Fi protection.'],['Disable unused switch ports.','Use strong credentials or enterprise authentication.'],['Use access control and network segmentation.','Update access points and isolate guest networks.'])}
<h3>Lecture Summary</h3>${bg('Summary map',[['Threats','Malware, social engineering, DoS and DDoS'],['Firewall','ALLOW and BLOCK rules'],['IDS / IPS','Detect and alert / detect and block'],['Wired and wireless','Physical and port controls; WPA3']])}${tb(['Topic','Core idea'],['Network security','Protects network devices, services, and transmitted information.'],['Malware','Virus: host file; Worm: self-spreads; Trojan: disguised program.'],['Social engineering','Manipulates people; phishing is a common example.'],['DoS / DDoS','Disrupt service availability; one source versus many sources.'],['Firewall','Controls allowed and blocked traffic using rules.'],['IDS / IPS','IDS detects and alerts; IPS detects and can block.'],['Wired / Wireless','Wired: physical and port controls; wireless: encryption and access controls.'])}</div>`,
hw:`<div class=en><h3>Answers to the review questions</h3><ol><li>Network security is the protection of network devices, services, and data from unauthorized access, misuse, alteration, or disruption. It is important because it protects transmitted information and keeps networks reliable and available (and limits unauthorized access).</li><li>A virus infects a host file or program; a worm self-replicates and spreads across networks automatically; a Trojan is disguised as legitimate software and relies on deception.</li><li>Social engineering manipulates people into revealing sensitive information or taking unsafe actions. A common attack is phishing.</li><li>A <b>DDoS</b> attack uses many devices to disrupt a service.</li><li>A firewall filters traffic using security rules. ALLOW permits traffic that meets the rules; BLOCK stops traffic that violates them (for example, allow HTTPS TCP 443, block Telnet TCP 23).</li><li>An IDS detects and alerts; an IPS detects and can block malicious traffic.</li><li>Wired: restrict physical access to switches and cables; disable unused ports. Wireless: use WPA3 or secure WPA2; isolate guest networks.</li></ol></div>`,

{n:8,sum:'أمن التطبيقات يحمي البرمجيات من الثغرات والإجراءات غير المصرح بها، وأمن البيانات يحمي المعلومات المخزنة والمنقولة. مبادئ أمن التطبيقات: التحقق من المدخلات، أقل صلاحية، مصادقة آمنة، ومعالجة آمنة للأخطاء. هجوم SQL Injection يتلاعب باستعلامات قاعدة البيانات عبر مدخلات خبيثة ويُمنع بالاستعلامات المُعلمة (Parameterized Queries). هجوم XSS يجعل المتصفح ينفذ سكربتاً مهاجماً ويُمنع بترميز المخرجات وCSP. البيانات أثناء النقل تُحمى بـ TLS وأثناء التخزين بتشفير التخزين. تشفير القرص الكامل FDE يحمي القرص عند فقدان الجهاز، وأمن قواعد البيانات يشمل التحكم بالوصول والتشفير والنسخ الاحتياطي والمراقبة.',
h:`<div class=en><p><b>Learning objectives:</b> Explain the basic principles of application security. Distinguish SQL Injection and Cross-Site Scripting (XSS) and identify basic defenses. Describe secure coding, defensive programming, and data protection methods. Explain full disk encryption and basic database security practices.</p>
<h3>1. Application and Data Security</h3>${fg('Basic secure application architecture',['WEB BROWSER: user request, interface','APPLICATION SERVER: authentication, input validation, business rules','DATABASE: controlled access, protected records'])}<p><b>Application Security:</b> The protection of software applications from threats, vulnerabilities, and unauthorized actions. <b>Data Security:</b> The protection of information from unauthorized access, alteration, loss, or disclosure.</p><p><b>Why important?</b> Protects users and sensitive information; reduces the risk of unauthorized access and data breaches; supports reliable and trustworthy digital services.</p><p><b>Basic secure architecture:</b> WEB BROWSER (user request, user interface) → APPLICATION SERVER (authentication, input validation, business rules) → DATABASE (controlled access, protected records). Security controls protect each part.</p><div class=co><b>Key idea:</b> Application security protects how software processes requests; data security protects the information that the software stores and transmits.</div>
<h3>2. Application Security Principles</h3><ul><li><b>Input Validation:</b> Check input type, length, and format before use.</li><li><b>Least Privilege:</b> Give users and programs only the permissions they need.</li><li><b>Secure Authentication:</b> Verify the identity of users accessing an application.</li><li><b>Safe Error Handling:</b> Avoid revealing sensitive technical details in errors.</li></ul>
<h3>2.1 SQL Injection (SQLi)</h3>${fg('How SQL injection works',['Attacker types crafted input','App inserts it into the SQL query','Modified query runs','Login bypassed'])}<div class=co><b>SQL Injection:</b> An attack that manipulates database queries by placing malicious input into an application that constructs unsafe SQL statements.</div><p><b>Basic protection:</b> Use parameterized queries (prepared statements) to keep SQL commands separate from user input. Restrict database account privileges and validate input.</p><p><b>Example (login bypass):</b> The attacker enters <code>administrator'--</code> in the login field. The vulnerable application inserts the input directly into the query: <code>SELECT * FROM users WHERE username = 'administrator' -- AND password = 'secret';</code> The comment sequence causes the remaining password check to be ignored, the database executes the modified query, and access is granted. It happens because the application concatenates user input directly into SQL statements.</p><p><b>Basic prevention:</b> (1) Use parameterized queries, (2) validate and sanitize input, (3) apply least privilege.</p>
<h3>2.2 Cross-Site Scripting (XSS)</h3><div class=co><b>XSS:</b> A web vulnerability in which untrusted content causes a browser to execute attacker-controlled script in a trusted website context.</div><p><b>Reflected XSS flow:</b> The attacker creates a link containing a script, the victim clicks it or requests the site, and the browser loads the site and executes the injected script.</p><p><b>Basic protection:</b> Use context-aware output encoding to display untrusted data safely instead of executing it as script. Avoid unsafe HTML insertion; use Content Security Policy (CSP) as an additional defense.</p>
<h3>2.3 Secure Coding and Defensive Programming</h3><p><b>Secure Coding:</b> Developing software using practices that reduce security vulnerabilities (validate untrusted input, use parameterized queries, encode displayed output). <b>Defensive Programming:</b> Writing software that safely handles unexpected input, errors, and misuse (handle errors safely, check access before actions, log important security events).</p>
<h3>3. Protecting Data in Transit and at Rest</h3><p><b>Data in Transit:</b> Information moving between devices or systems through a network. <b>Data at Rest:</b> Information stored on devices, disks, or databases.</p>${tb(['Data state','Protection method','Purpose'],['In Transit','TLS (e.g., HTTPS)','Protect communication from interception and tampering.'],['At Rest','Storage encryption','Protect stored data from unauthorized reading.'])}<div class=co><b>Important:</b> Encryption supports confidentiality. Proper access controls, integrity checks, and backups provide additional protection.</div>
<h3>3.1 Full Disk Encryption (FDE)</h3>${fg('Full disk encryption',['Lost device: disk stays encrypted','Cannot be read without the key','Correct credentials unlock it'])}<div class=co><b>FDE:</b> A security method that encrypts data on a storage drive and requires authorized unlocking to access the protected contents.</div><p><b>Benefits:</b> Helps protect stored data if a laptop or drive is lost or stolen; encrypts files and system data on the drive; reduces exposure to offline access when the device is powered off.</p><p><b>Limitation:</b> FDE does not stop an attacker from reading files through an already unlocked and compromised account. It also does not replace regular backups.</p><p><b>File/folder encryption vs full-disk encryption:</b> File or folder encryption protects selected data after the operating system starts. Full-disk encryption uses preboot authentication (password, token, or smart card based) and protects the entire system, including the boot process, operating system, system files, and data.</p>
<h3>3.2 Database Security Practices</h3><div class=co><b>Database Security:</b> Protecting a database, its accounts, and stored records against unauthorized access, disclosure, alteration, or loss.</div><ul><li><b>Access Control:</b> Allow only authorized users and roles.</li><li><b>Least Privilege:</b> Grant only the permissions needed for a task.</li><li><b>Secure Queries:</b> Use parameterized queries to prevent SQL injection.</li><li><b>Encryption:</b> Protect sensitive database records at rest and in transit.</li><li><b>Secure Backups and Recovery:</b> Protect backup copies and regularly test data restoration.</li><li><b>Monitoring:</b> Record and review important database activity.</li></ul><p>A secure application and a secure database work together: unsafe application code can expose database records even when database access is restricted.</p>
<h3>Lecture Summary</h3>${bg('Summary map',[['Application security','Input validation, least privilege, safe errors'],['SQLi and XSS','Parameterized queries; output encoding and CSP'],['Data protection','TLS in transit; encryption at rest; FDE'],['Database security','Access, queries, encryption, backups, monitoring']])}${tb(['Topic','Core idea'],['Application Security','Protect applications from vulnerabilities and unauthorized actions.'],['SQL Injection','Unsafe database queries can be manipulated by untrusted input.'],['XSS','Untrusted content may cause a browser to execute malicious script.'],['Secure Coding','Develop code that validates input and handles errors safely.'],['Data in Transit / At Rest','Protect information during communication and storage.'],['FDE','Encrypt a device drive to help protect stored data.'],['Database Security','Use permissions, safe queries, encryption, backup, and monitoring.'])}</div>`,
hw:`<div class=en><h3>Answers to the review questions</h3><ol><li><b>Application security</b> protects software applications from threats, vulnerabilities, and unauthorized actions. <b>Data security</b> protects information from unauthorized access, alteration, loss, or disclosure.</li><li>Any two of: input validation, least privilege, secure authentication, safe error handling.</li><li>SQL injection manipulates database queries by placing malicious input into an application that builds unsafe SQL. Parameterized queries keep SQL commands separate from user input, so the input cannot change the query.</li><li>XSS makes a browser execute attacker-controlled script in a trusted website. Context-aware output encoding displays untrusted data safely instead of executing it as script.</li><li>Secure coding develops software using practices that reduce vulnerabilities (validate input, parameterized queries, encode output). Defensive programming writes software that safely handles unexpected input, errors, and misuse.</li><li>Data in transit moves through a network and is protected by TLS (HTTPS). Data at rest is stored on devices, disks, or databases and is protected by storage encryption.</li><li>Full disk encryption encrypts the data on a drive and requires authorized unlocking. Limitation: it does not stop an attacker using an already unlocked compromised account (and does not replace backups).</li><li>Access control, least privilege, secure queries, encryption, secure backups, monitoring (any three). Secure backups matter because backup copies can expose or lose data if unprotected, and tested restoration allows recovery.</li></ol></div>`,

{n:9,sum:'إدارة الأمن السيبراني تنظّم الأشخاص والسياسات والأنشطة لتقليل المخاطر. السياسة الأمنية (WHAT) قاعدة مكتوبة تحدد ما تتطلبه المؤسسة، والإجراء (HOW) خطوات تفصيلية لتنفيذها. دورة تطوير السياسة خمس خطوات: تحديد الأهداف، تقييم المخاطر، كتابة القواعد، التطبيق والتدريب، المراجعة. الاستجابة للحوادث ست خطوات تعليمية: التحضير، التحديد، الاحتواء، الاستئصال، التعافي، الدروس المستفادة. المعيار ISO/IEC 27001:2022 يحدد متطلبات نظام إدارة أمن المعلومات (ISMS) وشهادته اختيارية، وإطار NIST CSF 2.0 مرن وله ست وظائف: GOVERN وIDENTIFY وPROTECT وDETECT وRESPOND وRECOVER.',
h:`<div class=en><p><b>Learning objectives:</b> Explain the role of cybersecurity management in protecting organizational information. Differentiate security policies from security procedures and give practical examples. Describe the main activities involved in managing a cybersecurity incident. Distinguish ISO/IEC 27001 from the NIST Cybersecurity Framework (CSF 2.0).</p>
<h3>Introduction</h3><p>Cybersecurity management organizes people, policies, and security activities to reduce risks to information and digital services. For a college, this includes protecting student records, monitoring its systems, and responding to security incidents.</p>
<h3>1. Security Policies and Procedures</h3><p><b>Security Policy:</b> A written rule that states what an organization requires to protect its information. <b>Security Procedure:</b> Step-by-step instructions that explain how employees must follow a security policy.</p><div class=co><b>Example: who may change student grades?</b><br>POLICY = WHAT: Only authorized registration staff may change a student grade.<br>PROCEDURE = HOW: 1. Verify staff identity. 2. Obtain approval. 3. Record the change in a log.</div><p><b>Why are policies important?</b> They protect confidentiality, integrity, and availability (CIA); clarify security responsibilities and safe behavior; and provide consistent rules for incident reporting and data protection.</p><p><b>Key elements of a security policy:</b></p><ul><li><b>Access control:</b> Define who may use sensitive systems or data.</li><li><b>Data protection:</b> Explain how important information is handled and stored.</li><li><b>Incident reporting:</b> Tell users how to report suspicious events.</li><li><b>Monitoring and auditing:</b> Review activity logs and compliance.</li><li><b>Security awareness:</b> Train employees to recognize threats.</li></ul><h3>From Policy to Practice</h3>${fg('Policy development cycle',['1 Set goals','2 Assess risk','3 Write rules','4 Apply and train','5 Review (repeat)'])}<p>Policies must be updated as risks, technology, and organizational needs change. The policy development cycle (continuous improvement):</p><ol><li><b>Set goals:</b> Define what to protect and the desired security outcomes.</li><li><b>Assess risk:</b> Identify and evaluate threats, vulnerabilities, and risks.</li><li><b>Write rules:</b> Define and document security policies and procedures.</li><li><b>Apply and train:</b> Implement the rules and provide security awareness training.</li><li><b>Review:</b> Monitor, audit, and review the policy. Update it as needed.</li></ol>
<h3>2. Incident Response and Management</h3><p><b>Security Incident:</b> An event that compromises or threatens information or a system, such as malware infection, stolen credentials, or unauthorized disclosure. <b>Incident Response:</b> The planned actions used to investigate an incident, limit damage, restore services, and prevent similar problems.</p><p><b>Main goals:</b> Detect and understand the incident quickly; contain damage and restore safe operation; learn from the event and improve security controls.</p><p><b>Incident management responsibilities:</b> Assigning responsibilities; reporting security incidents; documenting response actions.</p><p><b>Six teaching steps:</b></p>${fg('Incident response',['1 Preparation','2 Identification','3 Containment','4 Eradication','5 Recovery','6 Lessons learned'])}<ol><li>Preparation</li><li>Identification</li><li>Containment</li><li>Eradication</li><li>Recovery</li><li>Lessons Learned</li></ol><div class=co><b>Example:</b> If security software detects malware on a laboratory PC, the IT team checks the alert, isolates the device if needed, cleans it, restores trusted data, and records the lesson learned.</div><div class=co><b>NIST guidance:</b> NIST SP 800-61 Rev. 3 (2025) integrates incident response with cybersecurity risk management. The six steps above are simplified teaching activities, not the six official NIST CSF 2.0 Functions.</div>
<h3>3. Security Standards and Frameworks</h3>${bg('NIST CSF 2.0 Functions',[['GOVERN','Strategy, roles, oversight'],['IDENTIFY','Know systems and risks'],['PROTECT','Apply safeguards'],['DETECT','Recognize incidents'],['RESPOND','Manage incidents'],['RECOVER','Restore services']])}<p>Standards and frameworks help organizations organize responsibility, assess risks, and improve protection.</p><p><b>ISO/IEC 27001:2022</b> is an international standard specifying requirements for an Information Security Management System (ISMS). An ISMS manages information-security risks through policies, responsibilities, controls, and continuous improvement. Example: a college controls who can change student grades, records these changes, and reviews access rights. An organization may implement it without seeking certification; certification is optional.</p><p><b>NIST CSF 2.0</b> is a flexible framework for organizing cybersecurity risk management. Its six Functions work together rather than following a strict sequence.</p>${tb(['Function','Description'],['GOVERN','Strategy, roles, and oversight'],['IDENTIFY','Know your systems and risks'],['PROTECT','Apply safeguards'],['DETECT','Recognize possible incidents'],['RESPOND','Manage confirmed incidents'],['RECOVER','Restore essential services'])}${tb(['Aspect','ISO/IEC 27001:2022','NIST CSF 2.0'],['Type','International ISMS requirements standard','Flexible risk-management framework'],['Main use','Build and maintain an ISMS','Organize and improve cybersecurity outcomes'],['Certification','Optional third-party certification is available','No official NIST CSF certification'])}<p><b>Example:</b> A college using ISO/IEC 27001 establishes an ISMS with documented responsibilities and risk management procedures. Using NIST CSF 2.0, the same college can assess its practices across the six Functions to identify weaknesses and plan improvements.</p>
<h3>Lecture Summary</h3>${bg('Summary map',[['Policy and procedure','WHAT is required / HOW to follow it'],['Incident response','Six steps from preparation to lessons learned'],['ISO/IEC 27001','ISMS requirements standard'],['NIST CSF 2.0','Six Functions']])}<ul><li>A policy states the rule; a procedure explains the steps used to follow it.</li><li>Security policies require monitoring, staff training, and regular review.</li><li>Incident response limits harm, restores systems, and improves preparedness.</li><li>ISO/IEC 27001 focuses on the ISMS; NIST CSF 2.0 organizes risk management into six Functions.</li></ul></div>`,
hw:`<div class=en><h3>Answers to the review questions</h3><ol><li>Cybersecurity management organizes people, policies, and security activities to reduce risks to information and digital services.</li><li>A policy states WHAT is required (only authorized staff may change grades); a procedure states HOW to follow it (verify identity, obtain approval, record the change in a log).</li><li>Any three: access control, data protection, incident reporting, monitoring and auditing, security awareness.</li><li>The IT team checks the alert, isolates the device if needed, cleans it, restores trusted data, and records the lesson learned.</li><li>ISMS means Information Security Management System.</li><li>GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER.</li><li>ISO/IEC 27001 is an international ISMS requirements standard with optional certification; NIST CSF 2.0 is a flexible risk-management framework with no official certification.</li></ol></div>`,

{n:10,sum:'أمن السحابة يحمي البيانات والتطبيقات والخدمات المستضافة سحابياً. التحديات: الإعدادات الخاطئة، ضعف التحكم بالوصول، تعرض البيانات، ومحدودية الرؤية. المسؤولية مشتركة: المزوّد يحمي مراكز البيانات والعتاد والبنية التحتية، والعميل يحمي الصلاحيات وMFA والبيانات والإعدادات والمراقبة. أمن إنترنت الأشياء IoT: مخاطره كلمات المرور الافتراضية والبرمجيات القديمة وانكشاف الخصوصية وإساءة الاستخدام كـ Botnet، وممارساته كلمات مرور فريدة وتحديثات وفصل الشبكات. التحديات المستقبلية: التهديدات بمساعدة الذكاء الاصطناعي، نمو الأجهزة المتصلة، مخاطر الحوسبة الكمية على التشفير بالمفتاح العام، وسلاسل التوريد.',
h:`<div class=en><p><b>Learning objectives:</b> Define cloud security and identify common cloud-security challenges. Explain basic controls and shared responsibility in cloud environments. Identify major IoT security risks and recommended protective practices. Recognize future challenges facing information security.</p>
<h3>Introduction</h3><p>Modern services use cloud platforms, connected devices, and intelligent software. These technologies create new opportunities, but they also introduce security risks that organizations must manage.</p>
<h3>1. Cloud Security: Challenges and Solutions</h3><div class=co><b>Cloud Security:</b> The protection of cloud-hosted data, applications, and services against unauthorized access, exposure, and disruption.</div><p><b>Common challenges:</b></p><ul><li><b>Misconfiguration:</b> Incorrect settings may expose data or services.</li><li><b>Weak access control:</b> Stolen accounts or excessive privileges allow misuse.</li><li><b>Data exposure:</b> Sensitive files may be accessed without permission.</li><li><b>Limited visibility:</b> Missing logs and alerts delay threat detection.</li></ul>${tb(['Common challenge','Recommended control'],['Publicly exposed cloud storage','Restrict access permissions'],['Stolen or weak account credentials','Use MFA and least privilege'],['Sensitive data exposure','Encrypt sensitive data and restrict sharing'],['Undetected suspicious activity','Enable logging and monitoring'])}<h3>Shared Responsibility in Cloud Security</h3>${bg('Who protects what',[['Cloud provider','Data centers, physical hardware, underlying infrastructure'],['Cloud customer','Account permissions and MFA, data and settings, configuration and monitoring']])}<p>Cloud security is shared between the service provider and the customer. The provider protects the underlying cloud infrastructure; the customer protects its data, user access, and configurations. The exact division depends on the service used.</p>${tb(['Cloud provider','Cloud customer'],['Data center facilities','Account permissions and MFA'],['Physical hardware','Data and application settings'],['Underlying cloud infrastructure','Secure configuration and monitoring'])}<p><b>Basic cloud security practices:</b></p><ul><li><b>Strong authentication:</b> Use multi-factor authentication (MFA).</li><li><b>Least privilege:</b> Give each user only the access required.</li><li><b>Secure configuration:</b> Restrict public access and review settings.</li><li><b>Data protection:</b> Use encryption and tested backups.</li><li><b>Monitoring:</b> Review logs and investigate unusual activity.</li></ul><p><b>Example:</b> A college stores student files in a cloud service. Only approved staff should have access; MFA and activity logs help protect the files.</p>
<h3>2. IoT Security: Risks and Best Practices</h3>${fg('Simple secure IoT network',['IoT devices: camera, sensor, smart lock','Router / firewall: separate networks + rules','College network: student records, admin'])}<p><b>Internet of Things (IoT):</b> Physical devices that collect, process, or exchange data through network connections, such as smart cameras and sensors. <b>IoT Security:</b> Protecting connected devices, their communications, and the information they handle.</p><p><b>Common risks:</b></p><ul><li><b>Default or weak passwords:</b> Attackers may gain device access.</li><li><b>Outdated firmware:</b> Unfixed vulnerabilities can be exploited.</li><li><b>Privacy exposure:</b> Cameras and sensors may reveal sensitive data.</li><li><b>Botnet misuse:</b> Infected devices may be used in DDoS attacks.</li></ul><p><b>Simple secure IoT network:</b> IoT devices (CCTV camera, temperature sensor, smart lock) connect through a router/firewall that separates networks and applies access rules, blocking unauthorized access to the college network (student records, admin systems). IoT devices should not have unrestricted access to sensitive records.</p><p><b>Basic practices:</b> Use unique passwords and change insecure default settings. Install manufacturer security updates when available. Separate IoT devices from sensitive networks. Limit access and protect device communications.</p>
<h3>3. Future Challenges in Information Security</h3>${bg('Future challenges and responses',[['AI-assisted scams','Response: verify identities'],['Connected devices','Response: inventory and updates'],['Quantum risk','Response: plan post-quantum cryptography'],['Supply chains','Response: review vendors and software']])}<p>As digital technology develops, security teams must prepare for new forms of attack and larger, more complex systems.</p>${tb(['Challenge','Description','Response'],['AI-assisted threats','More convincing phishing, impersonation, and automated attacks.','Verify identities'],['Growth of connected devices','More devices increase the systems to manage and protect.','Inventory and updates'],['Quantum-computing risks','Powerful future quantum computers could threaten some current public-key cryptography.','Plan for post-quantum cryptography'],['Cloud and supply-chain risks','Organizations depend on external software and services that may be compromised.','Review vendors and software'])}<p><b>Preparing:</b> Train users to recognize suspicious content and identity fraud. Maintain inventories, updates, and secure access controls. Plan improvements to cryptography and evaluate third-party risks.</p>
<h3>Lecture Summary</h3>${bg('Summary map',[['Cloud security','Shared responsibility, MFA, least privilege'],['IoT security','Unique passwords, updates, network separation'],['Future risks','AI threats, devices, quantum, supply chain']])}<ul><li>Cloud security protects online data and services from exposure and disruption.</li><li>Cloud providers and their customers share security responsibilities.</li><li>IoT devices require strong access control, updates, and network separation.</li><li>Future risks include AI-enabled attacks, device growth, quantum computing, and supply-chain threats.</li></ul><div class=co>The end of this course is not the end of learning. Keep exploring, think critically, and use your knowledge responsibly to build a safer digital world.</div></div>`,
hw:`<div class=en><h3>Answers to the review questions</h3><ol><li>Cloud security is the protection of cloud-hosted data, applications, and services against unauthorized access, exposure, and disruption.</li><li>Any three: misconfiguration, weak access control, data exposure, limited visibility.</li><li>Cloud security is shared: the provider protects the underlying infrastructure (data centers, hardware); the customer protects its data, user access, and configurations.</li><li>IoT: physical devices that collect, process, or exchange data through network connections. Examples: smart cameras and sensors (smart lock).</li><li>Use unique passwords and change defaults; install security updates; separate IoT devices from sensitive networks; limit access and protect device communications.</li><li>Any three: AI-assisted threats, growth of connected devices, quantum-computing risks, cloud and supply-chain risks.</li><li>A powerful future quantum computer could threaten some current public-key cryptography, so organizations must plan improvements to their cryptography.</li></ol></div>`,

function say(x){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function paint(){document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';$('#br').textContent='🛡️ '+t('br');$('#hm').textContent=t('home');$('#gm').textContent=t('games');$('#lg').textContent=t('lg');side()}
const IC=['🛡️','🔐','🔑','🔏','🗝️','✍️','🌐','💻','📋','☁️'];
function side(){const[a,b]=view,s=$('#sb');s.innerHTML=`<div class=brand><span class=lg>A.Z</span><div><b>${t('br')}</b><small>InfoSec Studio</small></div></div>`+TT.map((x,i)=>`<button class="sl${a=='lec'&&b==i?' on':''}" ${L[i]?'':'disabled'} data-i=${i}><span>${IC[i]}</span><span>${x[lang=='ar'?1:0]}</span><em>L${i+1}</em></button>`).join('')+`<button class="sl${a=='exam'?' on':''}" data-x=e><span>📝</span><span>${t('exam')}</span></button><button class="sl${a=='games'?' on':''}" data-x=g><span>🎮</span><span>${t('games')}</span></button>`;s.querySelectorAll('[data-i]').forEach(q=>q.onclick=()=>{s.classList.remove('open');go('lec',+q.dataset.i)});s.querySelectorAll('[data-x]').forEach(q=>q.onclick=()=>{s.classList.remove('open');go(q.dataset.x=='e'?'exam':'games')})}
let view=['home'];
function go(...v){view=v;paint();const[a,b,c]=v,A=$('#app');A.innerHTML='';if(a=='home')home(A);else if(a=='lec')lec(A,b,c||'les');else if(a=='games')games(A,b);else if(a=='exam')run(A,sh(Q()).slice(0,50),0,()=>go('exam'));scrollTo(0,0)}
function home(A){A.innerHTML=`<h1>${t('br')}</h1><h2>${t('lecs')}</h2><div class=grid>${TT.map((x,i)=>`<button ${L[i]?'':'disabled'} data-i=${i}><b>L${i+1}</b> ${x[lang=='ar'?1:0]}<small>${L[i]?'':t('soon')}</small></button>`).join('')}</div><h2>${t('games')}</h2><div class=grid>${G.map(g=>`<button data-g=${g[0]}>${g[1]} ${g[2][lang=='ar'?0:1]}</button>`).join('')}<button data-ex=1>📝 ${t('exam')}</button></div>`;
A.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>go('lec',+b.dataset.i));A.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go('games',b.dataset.g));A.querySelector('[data-ex]').onclick=()=>go('exam')}
function lec(A,i,tab){const l=L[i];A.innerHTML=`<div class=hero><span class=hi>${IC[i]}</span><div><h1>${TT[i][lang=='ar'?1:0]}</h1><span class=mu>L${l.n} · ${TT[i][lang=='ar'?0:1]}</span></div></div><div class=tabs>${['les','terms','hw','quiz'].map(k=>`<button aria-selected=${k==tab} data-k=${k}>${t(k)}</button>`).join('')}</div><div id=bx></div>`;A.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go('lec',i,b.dataset.k));const bx=$('#bx');
if(tab=='les')bx.innerHTML=`<div class=card><div class=co>${l.sum}</div>${lang=='ar'&&l.ha?l.ha:l.h}${lang=='ar'&&!l.ha?'<p class=mu>الترجمة العربية الكاملة لهذه المحاضرة قريباً، والشرح أدناه بالإنجليزي.</p>':''}</div>`;
if(tab=='hw')bx.innerHTML=`<div class=card>${lang=='ar'&&l.hwa?l.hwa:l.hw}</div>`;
if(tab=='terms'){bx.innerHTML=`<div class=card><p class=mu>${t('desc')}</p><div class=tw><table><tr><th>Term</th><th>${t('tr')}</th><th>${t('meaning')}</th><th></th></tr>${l.terms.map((x,k)=>`<tr data-k=${k}><td class=en><b>${x[0]}</b></td><td><b>${x[1]}</b></td><td class=en>${x[2]}</td><td><button data-s=${k} aria-label="${t('listen')}">🔊</button></td></tr>`).join('')}</table></div></div>`;bx.querySelectorAll('tr[data-k]').forEach(r=>r.onclick=()=>say(l.terms[r.dataset.k][0]))}
if(tab=='quiz')run(bx,sh(l.q),0,()=>go('lec',i,'quiz'))}
function end(box,s,n,again){box.innerHTML=`<div class=card><h2>${t('score')}: ${s} / ${n}</h2><button class=b id=ag>${t('again')}</button></div>`;$('#ag').onclick=again}
function run(box,qs,timed,again){let i=0,s=0,left=60,iv;const fin=()=>{clearInterval(iv);end(box,s,i,again)};
if(timed)iv=setInterval(()=>{left--;const e=$('#tm');if(e)e.textContent=left;if(left<=0)fin()},1000);
(function show(){if(i>=qs.length)return fin();const[q,o,a]=qs[i];box.innerHTML=`<div class=card><div class=mu>${i+1}/${qs.length} ${timed?'⏱ <b id=tm>'+left+'</b>':''}</div><h3 class=en>${q}</h3>${sh(o.map((x,k)=>k)).map(k=>`<button class="o en" data-k=${k}>${o[k]}</button>`).join('')}</div>`;
box.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===a;if(ok)s++;box.querySelectorAll('.o').forEach(x=>{x.disabled=1;if(+x.dataset.k===a)x.classList.add('ok')});if(!ok)b.classList.add('bad');i++;setTimeout(show,timed?450:1100)})})()}
function games(A,g){if(!g){A.innerHTML=`<h1>${t('games')}</h1><div class=grid>${G.map(x=>`<button data-g=${x[0]}>${x[1]} ${x[2][lang=='ar'?0:1]}</button>`).join('')}</div>`;A.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go('games',b.dataset.g));return}
A.innerHTML=`<h1>${G.find(x=>x[0]==g)[1]} ${G.find(x=>x[0]==g)[2][lang=='ar'?0:1]}</h1><div id=bx></div>`;const bx=$('#bx'),again=()=>go('games',g);
if(g=='quiz')run(bx,sh(Q()).slice(0,10),0,again);if(g=='speed')run(bx,sh(Q()),1,again);
if(g=='flash'){const ts=sh(T());let i=0,f=0;(function show(){const x=ts[i];bx.innerHTML=`<div class=card><div class=mu>${i+1}/${ts.length} · ${t('flip')}</div><div class="card fc" id=fc>${f?`<b>${x[1]}</b><span class="en mu" style="font-size:16px">${x[2]}</span>`:`<b class=en>${x[0]}</b>`}</div><button id=sp>🔊 ${t('listen')}</button> <button class=b id=nx>${t('next')}</button></div>`;$('#fc').onclick=()=>{f=!f;show()};$('#sp').onclick=()=>say(x[0]);$('#nx').onclick=()=>{i=(i+1)%ts.length;f=0;show()};})()}
if(g=='match'){const ts=sh(T()).slice(0,5);let sel=null,d=0;bx.innerHTML=`<div class=card><p class=mu>${t('pick')}</p><div class=g2><div>${ts.map((x,k)=>`<button class="o en c1" data-i=${k}>${x[0]}</button>`).join('')}</div><div>${sh(ts.map((x,k)=>k)).map(k=>`<button class="o en c2" data-i=${k}>${ts[k][2]}</button>`).join('')}</div></div></div>`;
bx.querySelectorAll('.c1').forEach(b=>b.onclick=()=>{bx.querySelectorAll('.c1').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
bx.querySelectorAll('.c2').forEach(b=>b.onclick=()=>{if(!sel)return;if(sel.dataset.i==b.dataset.i){sel.classList.add('ok');b.classList.add('ok');sel.disabled=b.disabled=1;sel=null;if(++d==5)end(bx,5,5,again)}else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}})}
if(g=='tf'){const ts=sh(T()),n=Math.min(10,ts.length);let i=0,s=0;(function show(){if(i>=n)return end(bx,s,n,again);const x=ts[i],v=Math.random()<.5,m=v?x[2]:ts[(i+1)%ts.length][2];bx.innerHTML=`<div class=card><div class=mu>${i+1}/${n} · ${t('tf')}</div><h3 class=en>${x[0]}: ${m}</h3><button class=o data-v=1>✔</button><button class=o data-v=0>✘</button></div>`;bx.querySelectorAll('.o').forEach(b=>b.onclick=()=>{if((b.dataset.v==1)==v)s++;i++;show()})})()}
if(g=='scr'){const ts=sh(T().filter(x=>/^[A-Za-z]+$/.test(x[0]))),n=Math.min(8,ts.length);let i=0,s=0;(function show(){if(i>=n)return end(bx,s,n,again);const x=ts[i];let w=x[0].toLowerCase(),z=sh(w).join('');bx.innerHTML=`<div class=card><div class=mu>${i+1}/${n}</div><h2 class=en>${z}</h2><p>${t('hint')}: ${x[1]}</p><input id=an autocomplete=off><br><br><button class=b id=ck>${t('check')}</button></div>`;$('#ck').onclick=()=>{if($('#an').value.trim().toLowerCase()==w)s++;i++;show()}})()}}
