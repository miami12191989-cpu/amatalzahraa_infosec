Object.assign(L[2],{ha:`<div class=co><b>الهدف من المحاضرة:</b> تشرح هذه المحاضرة مفهوم ومبادئ التشفير المتماثل، وتوضح كيف يُستخدم مفتاح سري مشترك واحد، وتقدّم الشفرات الكتلية والتدفقية، وتقارن AES وDES و3DES، وتناقش التطبيقات الشائعة والمزايا والقيود.</div>
<h3>1. المقدمة</h3><p>قدّمت المحاضرة الثانية النص الصريح والنص المشفر والتشفير وفك التشفير والخوارزميات والمفاتيح التشفيرية. وتطبّق هذه المحاضرة تلك المفاهيم على أول نوع رئيسي من التشفير الحديث: التشفير المتماثل. وهو يُستخدم على نطاق واسع لأنه يستطيع حماية كميات كبيرة من البيانات بسرعة. ومتطلبه الرئيسي أن يستخدم المرسل والمستقبل المفتاح السري نفسه، وأن يمنعا الأشخاص غير المخوّلين من الحصول عليه.</p>
<div class=co><b>تشبيه بسيط:</b> صندوق مقفل بمفتاح واحد مشترك. يُقفل المرسل الصندوق بالمفتاح، ويفتحه المستقبل بالمفتاح نفسه. وإذا نسخ شخص آخر المفتاح فقدت الحماية.</div>
<h3>2. ما هو التشفير المتماثل</h3><p>طريقة تشفيرية تستخدم مفتاحاً سرياً مشتركاً واحداً للتشفير وفك التشفير معاً. ويُسمى أيضاً التشفير بالمفتاح السري.</p>${tb(['العنصر','الدور'],['النص الصريح','البيانات الأصلية المقروءة.'],['خوارزمية التشفير','تحوّل النص الصريح إلى نص مشفر.'],['المفتاح السري المشترك','يتحكم بالتشفير وفك التشفير معاً.'],['النص المشفر','النتيجة المحمية غير المقروءة.'],['خوارزمية فك التشفير','تستعيد النص الصريح الأصلي.'])}<div class=co>لا تحتاج الخوارزمية إلى أن تكون سرية. فالأمن الحديث يعتمد أساساً على استخدام خوارزمية موثوقة وإبقاء المفتاح سرياً.</div>
<h3>3. كيف يعمل</h3>${fg('مفتاح سري مشترك واحد',['PLAINTEXT','ENCRYPTION: algorithm + key','CIPHERTEXT','DECRYPTION: same key','PLAINTEXT'])}${tb(['الخطوة','ما يحدث'],['1 توليد المفتاح','يُنشأ مفتاح سري عشوائي قوي.'],['2 مشاركة المفتاح الآمنة','يحصل المرسل والمستقبل المخوّلان على المفتاح نفسه.'],['3 التشفير','يحوّل المرسل النص الصريح إلى نص مشفر.'],['4 الإرسال أو التخزين','يُرسَل النص المشفر أو يُخزَّن بصيغة محمية.'],['5 فك التشفير','يستخدم المستقبل المفتاح نفسه لاسترجاع النص الصريح.'])}<div class=co><b>مبدأ مهم:</b> إذا انكشف المفتاح السري فقد يتمكن شخص غير مخوّل من فك تشفير البيانات. وحماية المفتاح لا تقل أهمية عن الخوارزمية نفسها.</div>
<h3>3.1 المفتاح السري المشترك</h3><p>قيمة ثنائية عشوائية تتحكم بتحويل التشفير. وهي ليست عادةً كلمة يختارها المستخدم. فالأنظمة القوية تولّد المفاتيح ببرمجيات أو عتاد آمن وتخزّنها في أنظمة إدارة مفاتيح محمية.</p>${tb(['الخاصية','الشرح'],['الحيازة','يجب أن يملك المرسل والمستقبل المخوّلان المفتاح السري نفسه.'],['الغرض','يتحكم بكيفية تحول النص الصريح إلى نص مشفر.'],['أحجام مفاتيح AES','128 أو 192 أو 256 بت؛ مفتاح 128 بت يحتوي 16 بايت.'],['الحماية','احمِ المفتاح أثناء التوليد والتخزين والاستخدام والتبادل والحذف.'],['انكشاف المفتاح','إذا حصل المهاجم على المفتاح فقد تُفكّ تشفير البيانات.'],['المفتاح وكلمة المرور','كلمة المرور ليست تلقائياً مفتاحاً تشفيرياً قوياً.'])}<h3>4. الشفرات الكتلية والتدفقية</h3>${tb(['الخاصية','الشفرة الكتلية','الشفرة التدفقية'],['المعالجة','كتل ثابتة الحجم.','بت واحد أو بايت واحد في كل مرة.'],['الاستخدام','الملفات والأقراص وقواعد البيانات.','تدفقات البيانات المستمرة أو الفورية.'],['مثال','AES','ChaCha20'],['الفكرة','تُعالَج كل كتلة عبر عدة جولات.','يُدمج النص الصريح مع تدفق مفاتيح مولّد.'])}<h3>5. الخوارزميات الشائعة</h3>${fg('من الخوارزميات القديمة إلى AES',['DES: 56-bit, insecure','3DES: DES three times, slow','AES: 128/192/256-bit'])}${tb(['الخوارزمية','حجم الكتلة','حجم المفتاح','الحالة'],['DES','64 بت','56 بت','قديمة وغير آمنة'],['3DES','64 بت','مفتاحا/ثلاثة DES','قديمة؛ أبطأ ويجري تقاعدها'],['AES','128 بت','128/192/256 بت','المعيار الحديث الموصى به'])}<p><b>5.1 DES:</b> شفرة كتلية تاريخية بمفتاح 56 بت وكتل 64 بت. الحواسيب الحديثة تختبر فضاء مفاتيحها بسرعة كبيرة؛ لا تستخدمها.</p><p><b>5.2 3DES:</b> يطبّق DES ثلاث مرات. أقوى من DES لكنه بطيء ويستخدم كتلة 64 بت؛ الأنظمة تنتقل إلى AES.</p><p><b>5.3 AES:</b> الشفرة الكتلية المتماثلة الحديثة الرئيسية. كتل 128 بت بمفاتيح 128/192/256 بت. آمن وفعّال عند التنفيذ الصحيح وإدارة المفاتيح القوية.</p>${tb(['حجم مفتاح AES','عدد الجولات','المعنى'],['128 بت','10','قوي وفعّال للتطبيقات الشائعة'],['192 بت','12','فضاء مفتاح أكبر'],['256 بت','14','أكبر حجم مفتاح AES'])}<p><b>5.4 أخرى:</b></p>${tb(['الخوارزمية','النوع','الوصف'],['Blowfish','كتلية','كتلة 64 بت وأحجام مفاتيح متغيرة؛ أقدم.'],['Twofish','كتلية','كتلة 128 بت ومفاتيح حتى 256 بت.'],['RC4','تدفقية','استُخدمت في WEP وSSL/TLS القديمة؛ غير آمنة.'],['ChaCha20','تدفقية','شفرة تدفقية حديثة سريعة وآمنة.'])}<h3>6. مثال: تقرير درجات جامعي</h3><p>يخزّن قسم تقرير درجات رقمياً. يستخدم النظام AES ومفتاحاً سرياً لتشفير التقرير قبل حفظه. ويستخدم نظام مخوّل المفتاح نفسه لفك تشفيره عندما يحتاج موظف معتمد إلى قراءته.</p>${tb(['الجزء','المثال'],['النص الصريح','Student ID 2401 Grade 85'],['الخوارزمية','AES'],['المفتاح السري المشترك','مفتاح قوي مخزّن في نظام إدارة مفاتيح محمي'],['النص المشفر','تسلسل بتات محمي غير مقروء'],['النتيجة المخوّلة','تقرير الدرجات الأصلي بعد فك التشفير'])}<h3>7. التطبيقات</h3>${tb(['التطبيق','الاستخدام'],['تشفير الملفات والأقراص','يحمي الملفات والمجلدات والأقراص المخزّنة.'],['تشفير قواعد البيانات','يحمي السجلات الحساسة.'],['الاتصالات الشبكية الآمنة','يحمي البيانات الكبيرة بعد إنشاء مفتاح الجلسة.'],['VPN','يشفّر حركة المرور بين المستخدم والشبكة الخاصة.'],['التخزين السحابي','يحمي البيانات المخزّنة سحابياً.'],['المصارف والمدفوعات','يحمي بيانات المعاملات والعملاء.'],['تطبيقات المراسلة','يحمي محتوى الرسائل وبيانات التطبيق.'])}<div class=co><b>الممارسة الحديثة:</b> التشفير غير المتماثل ينشئ مفتاح جلسة، ثم التشفير المتماثل يحمي البيانات بكفاءة.</div>
<h3>8. المزايا والقيود</h3>${tb(['المزايا','القيود'],['سريع وفعّال للبيانات الكبيرة.','يجب مشاركة المفتاح السري بشكل آمن.'],['يحتاج حوسبة أقل من غير المتماثل.','المفتاح المسروق قد يكشف البيانات.'],['مناسب للتخزين والاتصالات عالية السرعة.','إدارة العديد من المستخدمين والمفاتيح معقدة.'],['مدعوم على نطاق واسع في العتاد والبرمجيات.','التشفير وحده لا يثبت هوية المرسل.'])}<p><b>8.1 مشكلة توزيع المفتاح:</b> قبل التواصل الآمن يجب أن يحصل الطرفان على المفتاح السري نفسه. وإرساله عبر قناة غير آمنة قد يسمح للمهاجم بنسخه. هذه هي التحدي الرئيسي للتشفير المتماثل.</p><h3>9. الاستخدام الآمن</h3><ul><li>استخدم خوارزمية حديثة موثوقة مثل AES؛ لا تستخدم DES.</li><li>ولّد مفاتيح عشوائية قوية، لا كلمات بسيطة.</li><li>خزّن المفاتيح في أنظمة محمية وحدّد الوصول.</li><li>دوّر المفاتيح وفق السياسة الأمنية.</li><li>استخدم طريقة آمنة لتوزيع المفاتيح أو إنشائها.</li><li>استخدم التشفير الموثّق عندما يكون ممكناً.</li></ul><div class=co><b>تحذير:</b> خوارزمية قوية لا تحمي البيانات إذا كان المفتاح مكشوفاً أو مشتركاً أو مولّداً من كلمة مرور ضعيفة.</div>
<h3>10. أمثلة تطبيقية</h3><p><b>XOR:</b> يعطي 1 عندما يختلف البتان، و0 عندما يتطابقان. التشفير: 10110110 XOR 11001010 = 01111100. فك التشفير: 01111100 XOR 11001010 = 10110110.</p><p><b>حساب المفاتيح:</b> عدد المفاتيح المطلوبة = n(n-1)/2. لـ8 مستخدمين: 28 مفتاحاً. لـ10: 45. لـ20: 190.</p><h3>11. دراسة حالة: نسخة احتياطية جامعية آمنة</h3><p>تُنشئ جامعة نسخة احتياطية يومية لسجلات الطلبة، ويشفّرها فريق تقنية المعلومات بـAES قبل تخزينها على خادم خارجي. ويُخزَّن المفتاح بشكل منفصل في نظام إدارة مفاتيح محمي.</p><ul><li><b>لماذا متماثل؟</b> النسخة كبيرة وAES فعّال للبيانات الكبيرة.</li><li><b>أهم سر؟</b> مفتاح AES.</li><li><b>لو سُرق الملف؟</b> المهاجم يرى نصاً مشفراً بشرط بقاء المفتاح محمياً.</li><li><b>لو فُقد المفتاح؟</b> قد لا تستطيع الجامعة استرجاع النسخة.</li><li><b>ضوابط أخرى؟</b> التحكم بالوصول والمصادقة والتخزين الآمن وفحوص السلامة.</li></ul><h3>12. الملخص</h3>${bg('خريطة الملخص',[['المفتاح','مفتاح سري مشترك واحد'],['القوة','سريع وفعّال للبيانات الكبيرة'],['الخوارزميات','AES مفضّل؛ DES و3DES قديمة'],['التحدي','التوزيع الآمن للمفاتيح']])}<p>يستخدم التشفير المتماثل مفتاحاً سرياً مشتركاً واحداً للتشفير وفك التشفير. سريع ومناسب للملفات والأقراص وقواعد البيانات وVPN والتخزين السحابي. الشفرات الكتلية تعالج كتلاً ثابتة؛ التدفقية تعالج البيانات باستمرار. DES قديمة، 3DES قديمة، AES هي المعيار المفضّل. التحدي الرئيسي هو التوزيع الآمن للمفاتيح وإدارتها.</p>`,hwa:`<div class=co><b>الواجب:</b> اختر تطبيقاً يستخدم التشفير المتماثل. اكتب فقرة قصيرة تحدد فيها النص الصريح والنص المشفر والمفتاح السري المشترك والخوارزمية والميزة ومخاطر إدارة المفاتيح.</div><h3>الحل (النسخ الاحتياطي الجامعي)</h3><p>النص الصريح هو النسخة الاحتياطية اليومية لسجلات الطلبة. الخوارزمية هي AES، تستخدم مفتاحاً سرياً مشتركاً واحداً مخزّناً في نظام إدارة مفاتيح محمي لإنتاج النص المشفر (تسلسل بتات غير مقروء على الخادم الخارجي). الميزة هي السرعة: AES يشفّر كميات كبيرة بكفاءة. مخاطر إدارة المفاتيح: لو سُرق المفتاح تُفكّ النسخة، ولو فُقد لا يمكن استرجاعها.</p>`});
Object.assign(L[3],{ha:`<div class=co><b>الهدف من المحاضرة:</b> تشرح هذه المحاضرة التشفير غير المتماثل، وتوضح دوري المفتاح العام والخاص، وتقدّم RSA وECC، وتبيّن كيف يدعم التشفير بالمفتاح العام الاتصالات الآمنة والمصادقة وإنشاء المفاتيح والتوقيعات الرقمية.</div>
<h3>1. المقدمة</h3><p>التشفير المتماثل سريع، لكن يجب أن يتشارك الطرفان مفتاحاً سرياً مسبقاً، وهو صعب عبر شبكة مفتوحة. يحل التشفير غير المتماثل هذه المشكلة باستخدام مفتاحين مرتبطين رياضياً. المفتاح العام يمكن توزيعه، بينما يجب أن يبقى المفتاح الخاص تحت سيطرة صاحبه.</p><div class=co><b>تشبيه بسيط:</b> صندوق بريد بفتحة يستطيع أي شخص استخدامها لوضع رسالة. صاحب الصندوق فقط يملك المفتاح الخاص الذي يفتحه. الفتحة تمثّل المفتاح العام.</div>
<h3>2. ما هو التشفير غير المتماثل</h3><p>يُسمى أيضاً التشفير بالمفتاح العام. يستخدم زوجاً من المفاتيح المرتبطة رياضياً: مفتاح عام ومفتاح خاص.</p>${tb(['المفتاح','من يعرفه','دور السرية','قاعدة الحماية'],['المفتاح العام','أي شخص يحتاجه','يشفّر البيانات لصاحب المفتاح','تحقق من أنه يعود فعلاً لصاحبه'],['المفتاح الخاص','صاحبه فقط','يفكّ تشفير البيانات المشفرة بالمفتاح العام المطابق','لا تشاركه أبداً؛ خزّنه بأمان'])}<div class=co><b>المبدأ:</b> المفتاحان مرتبطان رياضياً، لكن الخوارزمية الآمنة تجعل حساب المفتاح الخاص من المفتاح العام غير ممكن عملياً. المفتاح العام: يُشارك علناً، للتشفير أو التحقق. المفتاح الخاص: يحتفظ به صاحبه، لفك التشفير أو التوقيع.</div>
<h3>3. كيف تعمل السرية</h3>${fg('رسالة سرية إلى Bob',['ALICE: plaintext','ENCRYPT with Bob PUBLIC key','CIPHERTEXT','DECRYPT with Bob PRIVATE key','BOB: plaintext'])}<p>لإرسال معلومات سرية إلى Bob تحصل Alice على المفتاح العام الموثّق لـBob وتستخدمه لتشفير الرسالة. يفكّ Bob تشفير النص المشفر بمفتاحه الخاص المطابق.</p>${tb(['الخطوة','الإجراء','المفتاح'],['1','ينشئ Bob زوج مفاتيح مرتبطين رياضياً.','العام والخاص'],['2','يوزّع Bob مفتاحه العام ويحمي مفتاحه الخاص.','العام يُشارك؛ الخاص سري'],['3','تتحقق Alice وتشفّر بالمفتاح العام لـBob.','العام لـBob'],['4','ترسل Alice النص المشفر عبر الشبكة.','لا يُرسَل مفتاح خاص'],['5','يفكّ Bob تشفير النص المشفر.','الخاص لـBob'])}<div class=co><b>لماذا الأصالة مهمة:</b> لو استبدل مهاجم المفتاح العام لـBob بمفتاح مزيف فقد تشفّر Alice الرسالة لصالح المهاجم. الشهادات الرقمية والبصمات الموثوقة تساعد على التحقق.</div>
<h3>4. التشفير المتماثل وغير المتماثل</h3>${tb(['الخاصية','المتماثل','غير المتماثل'],['المفاتيح','مفتاح سري مشترك واحد','زوج عام وخاص'],['السرعة','سريع','أبطأ'],['الاستخدام','حماية بيانات كبيرة','إنشاء مفاتيح، مصادقة، توقيعات'],['أمثلة','AES','RSA وECC'])}<h3>5. RSA</h3><p>خوارزمية مفتاح عام معروفة ظهرت عام 1977. أمنها يعتمد على صعوبة تحليل عدد كبير جداً ناتج عن ضرب عددين أوليين كبيرين.</p>${tb(['المكوّن','المعنى'],['الأعداد الأولية p وq','عددان أوليان كبيران سريان للتوليد.'],['المعامل n','حاصل ضرب p × q؛ يظهر في المفتاحين.'],['الأس العام e','قيمة في المفتاح العام.'],['الأس الخاص d','قيمة سرية في المفتاح الخاص.'],['المفتاح العام','الزوج (n، e).'],['المفتاح الخاص','الزوج (n، d).'])}<p><b>العملية:</b> ولّد عددين أوليين كبيرين وأنشئ المفاتيح؛ وزّع المفتاح العام واحمِ الخاص؛ استخدم العام للتشفير والخاص لفك التشفير. استخدم حشواً معتمداً ومعايير أمان؛ الحساب النظري وحده غير آمن.</p>${tb(['مزايا RSA','قيود RSA'],['مدروسة ومُنفَّذة على نطاق واسع.','أبطأ وأكثر استهلاكاً للحوسبة.'],['تدعم التشفير والتوقيعات.','غير مناسبة لتشفير بيانات كبيرة مباشرة.'],['تعمل مع الشهادات والبروتوكولات.','تتطلب مفاتيح كبيرة وحشواً آمناً.'])}<h3>6. مثال تعليمي صغير على RSA</h3><p>أعداد صغيرة جداً فقط لإظهار الفكرة. لا تستخدم هذه القيم في نظام حقيقي.</p>${tb(['الخطوة','الحساب','النتيجة'],['1 اختر الأعداد','p=3 وq=11','أوليان صغيران'],['2 المعامل','n = 3×11','n = 33'],['3 فاي','(p-1)(q-1) = 2×10','phi = 20'],['4 الأس العام','e = 3','المفتاح العام = (33,3)'],['5 الأس الخاص','3×7=21 و21 mod 20=1','d=7؛ الخاص=(33,7)'],['6 التشفير M=4','C = 4³ mod 33','C = 31'],['7 فك التشفير','M = 31⁷ mod 33','M = 4'])}<p>المفتاح العام يحوّل 4 إلى نص مشفر 31، والخاص المطابق يعيد 4.</p><h3>7. ECC: التشفير بالمنحنيات الإهليلجية</h3><p>عائلة من طرق المفتاح العام تعتمد على رياضيات المنحنيات الإهليلجية فوق الحقول المنتهية. أمنها يعتمد على مشكلة اللوغاريتم المتقطع للمنحنيات الإهليلجية.</p>${tb(['الخاصية','الشرح'],['مفاتيح أصغر','أمن قوي بمفاتيح أصغر بكثير من RSA.'],['الكفاءة','متطلبات تخزين واتصال ومعالجة أقل.'],['الاتفاق على المفتاح','ECDH يساعد الطرفين على إنشاء سر مشترك.'],['التوقيعات','ECDSA لإنشاء والتحقق من التوقيعات.'],['الأجهزة المناسبة','الهواتف والبطاقات الذكية وإنترنت الأشياء.'])}<div class=co><b>تمييز:</b> ECC نهج واسع. ECDH لاتفاق المفاتيح، ECDSA للتوقيعات.</div>
<h3>8. مقارنة RSA وECC</h3>${tb(['الخاصية','RSA','ECC'],['الأساس','تحليل الأعداد','اللوغاريتم المتقطع'],['حجم المفتاح','أكبر','أصغر لأمن مكافئ'],['الكفاءة','حوسبة أعلى','تخزين واتصال أكفأ'],['الاستخدامات','تشفير، توقيعات، شهادات','اتفاق مفاتيح، توقيعات، هواتف وIoT'],['التنفيذ','ناضج ومدعوم','حديث وفعّال'])}<h3>9. خوارزميات أخرى للمفتاح العام</h3><p>ليس كل خوارزمية مفتاح عام هي خوارزمية تشفير.</p>${tb(['الخوارزمية','الغرض','ملاحظة'],['DSA','التوقيعات','للتوقيع والتحقق فقط.'],['Diffie-Hellman','اتفاق المفاتيح','ينشئ سراً مشتركاً؛ يلزم التحقق من الهوية.'],['ElGamal','تشفير وتوقيعات','معروفة أساساً بالتشفير.'],['ECDH','اتفاق مفاتيح ECC','فعّال للأسرار المشتركة.'],['ECDSA','توقيعات ECC','فعّال للتوقيعات الرقمية.'])}<h3>10. التطبيقات</h3>${tb(['التطبيق','الدور'],['HTTPS وTLS','يتحقق من الخادم وينشئ مفاتيح جلسة متماثلة.'],['البريد الآمن','يحمي الرسائل ويدعم التوقيعات.'],['المراسلة من طرف إلى طرف','تتحقق من الهوية وتنشئ المفاتيح.'],['الشهادات الرقمية','تربط مفتاحاً عاماً بهوية عبر CA موثوقة.'],['التوقيعات الرقمية','تتحقق من الموقّع وتكشف التغييرات.'],['SSH ونقل الملفات','تتحقق وتنشئ قنوات محمية.'],['المصارف والتجارة','تدعم جلسات مشفرة موثّقة.'])}<h3>11. التشفير الهجين</h3>${fg('التشفير الهجين',['PUBLIC KEY: authenticate','SESSION KEY: temporary','AES: encrypt data','SECURE DATA'])}<p>التشفير غير المتماثل مفيد للمصادقة وإنشاء المفاتيح لكنه أبطأ من البيانات الكبيرة، لذلك تجمع الأنظمة الحديثة بين الاثنين: مفتاح عام (مصادقة أو إنشاء مفتاح) ← مفتاح جلسة ← AES (تشفير البيانات الكبيرة) ← بيانات آمنة.</p><div class=co><b>مثال:</b> عندما يفتح طالب موقع الجامعة الآمن، يتحقق التشفير غير المتماثل من الموقع وينشئ مفتاح جلسة. ثم يحمي AES حركة الويب الرئيسية.</div>
<h3>12. المزايا والقيود</h3>${tb(['المزايا','القيود'],['لا حاجة لمشاركة مفتاح سري مسبقاً.','أبطأ من المتماثل.'],['يدعم المصادقة والتوقيعات.','غير فعّال لتشفير البيانات الكبيرة مباشرة.'],['المفاتيح العامة تُوزَّع على نطاق واسع.','يجب التحقق من أصالة المفتاح العام.'],['يدعم إنشاء مفاتيح آمنة عبر الشبكات المفتوحة.','المفتاح الخاص المسروق يكشف الهوية والبيانات.'],['يتوسع أفضل من المفاتيح الزوجية.','التنفيذ وإدارة الشهادات معقدان.'])}<p><b>حماية المفتاح الخاص:</b> ولّده بأمان، احمه بضوابط وصول قوية، خذ نسخة احتياطية فقط عند الحاجة، ألغِه أو استبدله عند الاشتباه. مشاركة المفتاح الخاص تُفقد الثقة.</p><h3>13. دراسة حالة: بوابة جامعية آمنة</h3><p>طالب يتصل عبر HTTPS. المتصفح يتحقق من شهادة البوابة، يستخدم التشفير غير المتماثل أثناء الإعداد، وينشئ مفتاح جلسة متماثلاً مؤقتاً يحمي معلومات الدخول والدرجات.</p><ul><li><b>يثبت الهوية؟</b> شهادة رقمية سارية مرتبطة بالمفتاح العام للبوابة.</li><li><b>يبقى سرياً على الخادم؟</b> المفتاح الخاص للخادم.</li><li><b>لماذا AES بعد الإعداد؟</b> أسرع لحركة الويب الكبيرة.</li><li><b>لو سُرق الخاص؟</b> قد ينتحل المهاجم شخصية الخادم.</li><li><b>الحل؟</b> إلغاء الشهادة واستبدال زوج المفاتيح والتحقيق.</li></ul><h3>14. أمثلة تطبيقية</h3>${tb(['الحالة','المفتاح الصحيح','السبب'],['Alice ترسل رسالة سرية إلى Bob.','العام لـBob','فقط الخاص لـBob يفكّها.'],['Bob يقرأ الرسالة.','الخاص لـBob','يطابق العام لـBob.'],['Bob يوقّع مستنداً.','الخاص لـBob','التوقيع مرتبط بـBob.'],['Alice تتحقق من توقيع Bob.','العام لـBob','يتحقق من توقيع أنشأه الخاص لـBob.'])}<h3>15. الملخص</h3>${bg('خريطة الملخص',[['زوج المفاتيح','عام وخاص'],['RSA','أعداد أولية كبيرة'],['ECC','مفاتيح أصغر وتشغيل فعّال'],['الاستخدامات','إنشاء المفاتيح والمصادقة']])}<p>يستخدم التشفير غير المتماثل زوجاً من مفتاح عام وخاص مرتبطين رياضياً. للسرية، يشفّر مفتاح المستلم العام ويفكّ الخاص. يدعم أيضاً المصادقة والتوقيعات وإنشاء المفاتيح. RSA تعتمد على تحليل الأعداد؛ ECC يقدم أماناً فعّالاً بمفاتيح أصغر. لأن عمليات المفتاح العام أبطأ، تستخدم الأنظمة الحديثة تصاميم هجينة.</p>`,hwa:`<div class=co><b>الواجب:</b> صف كيف يتصل طالب ببوابة جامعية بشكل آمن. حدّد المفتاح العام والخاص والشهادة ومفتاح الجلسة وأدوار التشفيرين.</div><h3>الحل</h3><ul><li><b>المفتاح العام:</b> للبوابة، يُرسَل إلى المتصفح داخل الشهادة.</li><li><b>الشهادة الرقمية:</b> موقّعة من CA؛ تربط هوية البوابة بمفتاحها العام.</li><li><b>المفتاح الخاص:</b> يبقى سرياً على خادم البوابة.</li><li><b>دور غير المتماثل:</b> يوثّق البوابة وينشئ مفتاح جلسة أثناء الإعداد.</li><li><b>مفتاح الجلسة:</b> مفتاح متماثل مؤقت لهذا الاتصال.</li><li><b>دور المتماثل:</b> AES يستخدم مفتاح الجلسة لحماية الدخول والدرجات بسرعة.</li></ul>`});
Object.assign(L[4],{ha:`<div class=co><b>الهدف من المحاضرة:</b> تشرح هذه المحاضرة إدارة المفاتيح، وتوضح دورة حياتها، وطرق توزيعها، ومركز توزيع المفاتيح (KDC)، وبروتوكول Diffie-Hellman، والبنية التحتية للمفتاح العام (PKI) ومكوناتها.</div>
<h3>1. إدارة المفاتيح (Key Management)</h3><div class=co><b>إدارة المفاتيح:</b> التعامل الآمن مع المفاتيح التشفيرية طوال دورة حياتها (التوليد، التوزيع، التخزين، الاستخدام، والتقاعد).</div><p><b>لماذا هي مهمة؟</b> تحمي المفاتيح من الوصول غير المصرح به، وتدعم السرية والسلامة والتوافر، وتقلل من مخاطر تعرض البيانات وفقدانها.</p>
<h3>2. دورة حياة المفتاح (5 مراحل رئيسية)</h3><ol><li><b>التوليد (Generation):</b> إنشاء مفتاح بشكل آمن باستخدام قيم عشوائية مناسبة وحجم مفتاح مناسب.</li><li><b>التوزيع (Distribution):</b> تسليم أو إنشاء المفتاح بشكل آمن.</li><li><b>التخزين والاستخدام (Storage and use):</b> حماية المفتاح والسماح بالاستخدام المصرح به فقط.</li><li><b>التدوير (Rotation):</b> استبدال المفتاح عند الحاجة بموجب السياسة أو حدود الاستخدام أو عند حدوث اختراق.</li><li><b>الاسترجاع والإتلاف (Recovery and Destruction):</b> الاحتفاظ بمفاتيح فك التشفير المحمية عندما يجب أن تظل البيانات القديمة قابلة للاسترداد. إتلاف المفاتيح عندما لا تعود هناك حاجة إليها.</li></ol>
<h3>3. قواعد حماية المفاتيح</h3><ul><li>تقييد الوصول إلى المفاتيح للمستخدمين والخدمات المصرح لها فقط.</li><li>لا تشارك المفاتيح السرية أو الخاصة أبداً في رسائل البريد الإلكتروني العادية أو الملفات غير المحمية.</li><li>احمِ نسخ الاسترداد عندما يجب أن تظل البيانات المشفرة القديمة قابلة للوصول.</li><li>استبدل المفاتيح المخترقة وحقق في احتمال تعرضها.</li></ul>
<h3>4. توزيع المفاتيح وتبادلها</h3><p><b>توزيع المفتاح:</b> تسليم مفتاح موجود لطرف مصرح له. <b>الاتفاق على المفتاح:</b> إنشاء سر مشترك من خلال بروتوكول تشفيري.</p><p><b>طرق التوزيع الشائعة:</b></p><ul><li><b>التوزيع اليدوي:</b> تسليم المفتاح شخصياً أو من خلال جهاز وإجراء محمي.</li><li><b>المفتاح المشترك مسبقاً:</b> حماية مفتاح جديد باستخدام مفتاح آمن مشترك بالفعل.</li><li><b>نقل المفتاح العام:</b> تشفير مفتاح متماثل باستخدام المفتاح العام الذي تم التحقق منه للمستلم؛ واسترداده بالمفتاح الخاص المقابل.</li></ul><p><b>نقل المفتاح العام لمفتاح الجلسة (Ks):</b> تقوم Alice (المرسل) بتشفير Ks بالمفتاح العام للمستلم؛ ويقوم Bob بفك التشفير بمفتاحه الخاص. <i>التحقق:</i> تحصل Alice على المفتاح العام الموثق لـBob. <i>الحماية:</i> ترسل Alice Ks في رسالة محمية بالمفتاح العام. <i>الاسترداد:</i> يستخدم Bob مفتاحه الخاص المطابق لاسترداد Ks للتشفير المتماثل.</p><div class=co><b>متطلب أمني:</b> يجب أن يكون المفتاح العام المرتبط بـBob أصيلاً. وإلا، يمكن للمهاجم استبداله بمفتاح مزيف.</div>
<h3>4.1 مركز توزيع المفاتيح (KDC)</h3>${fg('مفتاح جلسة KDC (R1)',['Alice asks KDC for a key to talk to Bob','KDC generates R1, sends protected copies','Alice forwards Bob’s copy','Alice and Bob use R1'])}<p><b>KDC:</b> خدمة موثوقة توفر مفاتيح الجلسات للأطراف المتصلة. <b>مفتاح الجلسة (Ks):</b> مفتاح مؤقت يستخدم لحماية جلسة اتصال. في نظام متماثل مبسط، يتشارك Alice وBob مفتاحاً رئيسياً طويل الأمد مختلفاً مع KDC. ينشئ KDC مفتاح جلسة (يُسمى R1) يمكن استخدامه من قبل الطرفين.</p><ol><li><b>الطلب:</b> تطلب Alice من KDC مفتاحاً للتواصل مع Bob.</li><li><b>التسليم المحمي:</b> ينشئ KDC المفتاح R1 ويرسل معلومات محمية موجهة لـAlice وBob.</li><li><b>إعادة التوجيه:</b> تمرر Alice معلومات Bob المحمية إلى Bob.</li><li><b>جلسة آمنة:</b> يستخدم Alice وBob R1 كمفتاح جلسة متماثل مشترك.</li></ol>
<h3>4.2 الاتفاق على مفتاح Diffie-Hellman</h3>${fg('Diffie-Hellman',['Each picks a private value','They exchange public values','Both compute the same secret Ks'])}<p>بروتوكول يسمح لطرفين بإنشاء سر مشترك عبر شبكة مفتوحة. يحسب كلا الطرفين السر بشكل مستقل؛ ولا يتم نقل السر نفسه.</p><ol><li><b>الاختيار:</b> تختار Alice وBob قيمهما الخاصة.</li><li><b>التبادل:</b> يتبادلان القيم العامة المقابلة.</li><li><b>الحساب:</b> يحسب كلاهما بشكل مستقل نفس السر المشترك.</li><li><b>القيد:</b> بدون مصادقة، يمكن أن يكون Diffie-Hellman الأساسي عرضة لهجوم الرجل في المنتصف.</li></ol>
<h3>5. البنية التحتية للمفتاح العام (PKI)</h3>${bg('أدوار PKI',[['CA','Issues and signs certificates'],['RA','Verifies applicants'],['Digital certificate','Public key + identity + CA signature'],['Repository','Stores certificates']])}<div class=co><b>PKI:</b> إطار عمل من السلطات والتكنولوجيا والسياسات والإجراءات لإدارة المفاتيح العامة والشهادات الرقمية. <b>الغرض الرئيسي:</b> إنشاء الثقة بأن المفتاح العام ينتمي إلى شخص أو جهاز أو خدمة معينة.</div><p><b>المكونات الرئيسية:</b></p><ul><li><b>جهة إصدار الشهادات (CA):</b> تصدر وتوقع الشهادات رقمياً؛ وقد تلغيها عند الحاجة.</li><li><b>جهة التسجيل (RA):</b> تتحقق من هوية مقدم الطلب قبل إصدار الشهادة.</li><li><b>الشهادة الرقمية:</b> تربط المفتاح العام للشخص بهوية معلوماته (المفتاح العام + الهوية + توقيع CA).</li><li><b>زوج المفاتيح العام/الخاص:</b> يمكن مشاركة المفتاح العام؛ يجب حماية المفتاح الخاص.</li><li><b>مستودع الشهادات:</b> يجعل الشهادات الصادرة والمعلومات ذات الصلة متاحة.</li><li><b>السياسات والإجراءات:</b> تحدد متطلبات الموافقة على الشهادة واستخدامها ودورة حياتها.</li></ul><div class=co><b>مهم:</b> تحتوي الشهادة الرقمية على المفتاح العام للموضوع، وليس المفتاح الخاص. ستتم دراسة كيفية إنشاء الشهادات وتوقيعها في المحاضرة السادسة.</div>
<h3>6. الملخص</h3>${bg('خريطة الملخص',[['إدارة المفاتيح','حماية المفاتيح طوال دورة حياتها'],['التوزيع / الاتفاق','KDC، نقل المفتاح العام، Diffie-Hellman'],['PKI','CA، RA، الشهادات، المستودع']])}`,hwa:`<div class=co><b>الواجب:</b> اشرح إدارة المفاتيح وطرق التوزيع ومكونات PKI.</div><h3>إجابات أسئلة المراجعة</h3><ol><li><b>إدارة المفاتيح</b> هي التعامل الآمن مع المفاتيح التشفيرية طوال دورة حياتها. وهي مهمة لأنها تحمي المفاتيح من الوصول غير المصرح به وتقلل من مخاطر تعرض البيانات وفقدانها.</li><li><b>توزيع المفتاح</b> يسلم مفتاحاً موجوداً لطرف مصرح له. <b>الاتفاق على المفتاح</b> ينشئ سراً مشتركاً عبر بروتوكول.</li><li><b>KDC</b> هي خدمة موثوقة توفر مفاتيح الجلسة للأطراف المتصلة.</li><li><b>خطأ.</b> تحتوي الشهادة الرقمية على المفتاح العام لصاحبها، وليس المفتاح الخاص.</li><li><b>CA</b> تصدر وتوقع الشهادات رقمياً وقد تلغيها. <b>RA</b> تتحقق من هوية مقدم الطلب قبل الإصدار.</li><li>التوليد، التوزيع، التخزين والاستخدام، التدوير، الاسترجاع والإتلاف.</li><li>تقييد الوصول للمصرح لهم فقط، وعدم مشاركة المفاتيح في بريد عادي أو ملفات مكشوفة.</li></ol>`});

Object.assign(L[5],{ha:`<div class=co><b>الهدف من المحاضرة:</b> شرح الغرض من التوقيعات الرقمية والتحقق منها، ووصف الشهادات الرقمية وخطوات إصدارها، ومقارنة طرق المصادقة ودور إدارة الهوية والوصول (IAM).</div>
<h2>الجزء الأول: التوقيعات والشهادات الرقمية</h2><h3>1. التوقيعات الرقمية</h3><div class=co><b>التوقيع الرقمي:</b> قيمة تشفيرية تُنشأ باستخدام المفتاح الخاص للموقّع ويتم التحقق منها باستخدام المفتاح العام المقابل.</div><p><b>خصائص الأمان:</b></p><ul><li><b>الأصالة (Authenticity):</b> تساعد على التحقق من هوية الموقّع عندما يكون المفتاح العام موثوقاً.</li><li><b>السلامة (Integrity):</b> تساعد على اكتشاف التغييرات التي تطرأ على الرسالة الموقعة.</li><li><b>عدم الإنكار (Non-repudiation):</b> توفر دليلاً يساعد في حل النزاعات عندما ينكر الموقّع توقيعه لرسالة.</li></ul><p><b>ملاحظة:</b> التوقيع لا يشفّر المستند. السرية تتطلب التشفير عند الحاجة.</p>
<h3>2. دوال التجزئة (Hash) في التوقيعات الرقمية</h3><p><b>دالة التجزئة:</b> تحول رسالة من أي طول إلى قيمة تجزئة ثابتة الطول (ملخص الرسالة). تعالج معظم أنظمة التوقيع ملخص الرسالة بدلاً من المستند الكامل مباشرة. تغيير المستند الموقع يغير ملخصه ويؤدي إلى فشل التحقق من التوقيع.</p>
<h3>3. كيف يعمل التوقيع الرقمي</h3>${fg('Bob يوقع',['Message M','HASH h','ENCRYPT h with Bob PRIVATE key','Signature S'])}${fg('Alice تتحقق',['S','DECRYPT with Bob PUBLIC key → h','Hash received M → h','Compare: valid or not'])}<p>التوقيع يستخدم المفتاح الخاص؛ والتحقق يستخدم المفتاح العام الموثوق.</p>
<h3>4. مثال عملي: توقيع RSA</h3><p>المعطيات: ملخص الرسالة h = 4، المفتاح الخاص d = 7، المفتاح العام e = 3، المعامل n = 33.</p><p><b>التوقيع:</b> S = h^d mod n = 4^7 mod 33 = 16.</p><p><b>التحقق:</b> V = S^e mod n = 16^3 mod 33 = 4.</p><p>بما أن V = h = 4، فإن التوقيع <b>صالح</b>.</p>
<h3>5. الشهادات الرقمية</h3><div class=co><b>الشهادة الرقمية:</b> بيانات اعتماد إلكترونية موقعة من CA تربط مفتاحاً عاماً بموضوع (شخص، جهاز، أو موقع ويب).</div><p>الحقول الرئيسية: الموضوع، المفتاح العام، المُصدر (CA موثوق)، الصلاحية، توقيع CA. <b>تحتوي على المفتاح العام، وليس الخاص أبداً.</b></p>
<h3>6. خطوات إصدار الشهادة</h3>${fg('إصدار الشهادة',['1 Key pair','2 CSR','3 Identity check','4 CA signs','5 Install / renew'])}<ol><li>إنشاء زوج مفاتيح عام/خاص؛ حماية المفتاح الخاص.</li><li>إنشاء طلب توقيع شهادة (CSR) يحتوي على المفتاح العام وتفاصيل الموضوع.</li><li>تتحقق CA أو RA من مقدم الطلب أو التحكم في النطاق.</li><li>توقع CA وتصدر الشهادة.</li><li>تثبيت الشهادة؛ تجديدها أو إلغاؤها عند الحاجة.</li></ol>
<h2>الجزء الثاني: تقنيات المصادقة</h2><h3>1. المصادقة وطرقها</h3>${bg('ثلاثة عوامل للمصادقة (MFA = عاملان مختلفان)',[['KNOW','Password or PIN'],['HAVE','Token or phone'],['ARE','Fingerprint or face']])}<div class=co><b>المصادقة:</b> عملية التحقق من الهوية المعلنة. تجيب على السؤال: من أنت؟</div>${tb(['فئة العامل','مثال'],['شيء تعرفه (KNOW)','كلمة المرور أو PIN'],['شيء تملكه (HAVE)','رمز أمان أو هاتف'],['شيء أنت عليه (ARE)','بصمة إصبع أو وجه'])}<ul><li><b>مصادقة كلمة المرور:</b> التحقق باستخدام كلمة مرور سرية.</li><li><b>مصادقة الرمز:</b> تستخدم رمز أمان (مثل مفتاح عتاد أو رمز).</li><li><b>المصادقة الحيوية:</b> تستخدم خصائص فيزيائية (بصمات، تعرف على الوجه).</li></ul><p><b>المصادقة متعددة العوامل (MFA):</b> تستخدم عوامل من فئتين مختلفتين على الأقل (كلمة مرور + رمز من هاتف). كلمتا مرور لا تعتبران عاملين مختلفين.</p>
<h3>2. إدارة الهوية والوصول (IAM)</h3><div class=co><b>IAM:</b> السياسات والعمليات والتقنيات لإدارة الهويات الرقمية والتحكم في الوصول إلى الأنظمة والبيانات.</div>${tb(['المصادقة (Authentication)','التفويض (Authorization)'],['تتحقق من <b>من</b> هو المستخدم.','تحدد <b>ماذا</b> يمكن للمستخدم التحقق منه الوصول إليه أو القيام به.'])}<p><b>وظائف IAM:</b> إنشاء وتحديث وإلغاء تنشيط الحسابات؛ تعيين الصلاحيات حسب الأدوار؛ مراجعة الصلاحيات وإزالة ما لم يعد مطلوباً؛ تسجيل أنشطة الوصول للمساءلة.</p>
<h3>3. تحديات المصادقة والابتكارات</h3><p><b>التحديات الشائعة:</b> كلمات مرور ضعيفة أو مسروقة؛ فقدان الرموز أو الهواتف؛ أخطاء الأنظمة الحيوية؛ صلاحيات قديمة.</p>${tb(['التحسين','الفكرة'],['مفاتيح المرور (Passkeys)','بيانات اعتماد تشفيرية للدخول بدون كلمة مرور.'],['المصادقة القائمة على المخاطر','طلب فحوصات إضافية عند الدخول من جهاز أو موقع غير معتاد.'])}<h3>الملخص</h3>${bg('خريطة الملخص',[['التوقيع الرقمي','الخاص يوقّع، العام يتحقق'],['الشهادة الرقمية','تربط الهوية بمفتاح عام عبر CA'],['المصادقة','تعرف، تملك، أنت؛ MFA'],['IAM','الهويات والصلاحيات']])}`,hwa:`<div class=co><b>الواجب:</b> اشرح التوقيع الرقمي، الشهادة، والمصادقة.</div><h3>إجابات أسئلة المراجعة</h3><ol><li>التوقيع الرقمي قيمة تشفيرية تُنشأ بالمفتاح الخاص ويتم التحقق منها بالمفتاح العام. الفوائد: الأصالة، السلامة، عدم الإنكار.</li><li>التوقيع يستخدم المفتاح <b>الخاص</b>، والتحقق يستخدم المفتاح <b>العام</b>.</li><li>الأنظمة توقع ملخص الرسالة (Hash) بدلاً من المستند الكامل؛ أي تغيير يغير الملخص ويفشل التحقق.</li><li>الشهادة الرقمية موقعة من CA تربط المفتاح العام بهوية. تصدر CA الشهادة بعد الفحوصات.</li><li>توليد زوج المفاتيح، إنشاء CSR، التحقق من مقدم الطلب، إصدار الشهادة.</li><li>تعرف: كلمة مرور. تملك: رمز أو هاتف. أنت: بصمة أو وجه.</li><li><b>خطأ.</b> كلمة المرور و PIN كلاهما شيء تعرفه، لذا هما نفس الفئة.</li><li>المصادقة تتحقق من هوية المستخدم؛ التفويض يحدد ما يمكنه الوصول إليه.</li><li>وظائف IAM: إنشاء الحسابات وتعيين الصلاحيات. الابتكار: Passkeys أو المصادقة القائمة على المخاطر.</li></ol>`});
Object.assign(L[6],{ha:`<div class=co><b>الهدف من المحاضرة:</b> تحديد مفهوم أمن الشبكات والتعرف على التهديدات الشائعة، والتمييز بين البرمجيات الخبيثة والهندسة الاجتماعية وهجمات حجب الخدمة (DoS وDDoS)، وشرح كيفية حماية الشبكات باستخدام الجدران النارية وأنظمة كشف/منع التسلل، وتحديد الضوابط الأساسية للشبكات السلكية واللاسلكية.</div>
<h3>1. أساسيات أمن الشبكات</h3><div class=co><b>أمن الشبكات:</b> حماية أجهزة الشبكة وخدماتها وبياناتها من الوصول غير المصرح به أو سوء الاستخدام أو التعديل أو التعطيل.</div><p><b>لماذا هو مهم؟</b> يحمي المعلومات المنقولة عبر الشبكات؛ ويحد من الوصول غير المصرح به إلى الأجهزة والخدمات؛ ويساعد في الحفاظ على موثوقية الشبكة وتوافرها. الجدار الناري يتحكم في حركة المرور بين الإنترنت العام والشبكة الداخلية المحمية.</p>${tb(['مبدأ CIA','مثال شبكي'],['السرية','استخدام التشفير لحماية البيانات المرسلة عبر الشبكة.'],['السلامة','اكتشاف التغييرات في الملف أثناء الإرسال.'],['التوافر','استخدام خوادم احتياطية للحفاظ على موقع الجامعة متاحاً إذا تعطل الخادم الرئيسي.'])}
<h3>2. التهديدات والهجمات الشائعة</h3><p><b>التهديد الأمني:</b> حدث أو حالة محتملة يمكن أن تضر بنظام أو معلوماته. <b>الهجوم الأمني:</b> محاولة لاختراق أمن نظام أو شبكة.</p>
<h3>2.1 البرمجيات الخبيثة وأنواعها</h3><p><b>البرمجيات الخبيثة (Malware):</b> برامج مصممة لإلحاق الضرر أو التعطيل أو سرقة المعلومات أو الوصول غير المصرح به. الأنواع تشمل الديدان والفيروسات وأحصنة طروادة والبرامج الإعلانية وبرامج التجسس والروبوتات وبرامج الفدية. تركز هذه المحاضرة على الفيروسات والديدان وأحصنة طروادة.</p>${tb(['النوع','تعريف قصير','الخاصية الرئيسية'],['الفيروس (Virus)','يصيب ملفاً أو برنامجاً شرعياً وينتشر عند تشغيل المضيف المصاب.','يتطلب برنامج أو ملف مضيف.'],['الدودة (Worm)','برمجية خبيثة تتكاثر ذاتياً ويمكنها الانتشار عبر الشبكات.','تنتشر تلقائياً.'],['حصان طروادة (Trojan)','برمجية خبيثة تتنكر في شكل تطبيق شرعي.','يعتمد على الخداع وليس التكاثر الذاتي.'])}<p><b>تذكر:</b> حصان طروادة لا يتكاثر ذاتياً بنفس طريقة الفيروس أو الدودة.</p>
<h3>2.2 الهندسة الاجتماعية</h3><p><b>الهندسة الاجتماعية:</b> التلاعب بالأشخاص لجعلهم يكشفون معلومات حساسة أو يتخذون إجراءات غير آمنة.</p><p><b>التصيد (Phishing):</b> هجوم هندسة اجتماعية يستخدم رسائل أو مواقع خادعة لخداع المستخدمين للكشف عن معلومات حساسة أو القيام بإجراءات غير آمنة. التدفق: يرسل المهاجم بريداً إلكترونياً أو رابطاً مزيفاً، يفتح المستخدم نموذج تسجيل دخول مزيف، وتُسرق كلمة المرور.</p>
<h3>2.3 هجمات حجب الخدمة (DoS و DDoS)</h3>${bg('DoS مقابل DDoS',[['DoS','مصدر واحد يغرق الخادم المستهدف'],['DDoS','العديد من الأجهزة المخترقة (شبكة روبوتات) تغرق الهدف']])}<p><b>هجوم DoS:</b> يعطل الخدمة، غالباً عن طريق إغراقها بالطلبات من مصدر واحد. <b>هجوم DDoS:</b> هجوم DoS يتم إطلاقه من مصادر متعددة، غالباً أجهزة مخترقة (شبكة روبوتات). يهدد كلاهما توافر الشبكة بشكل أساسي.</p>
<h3>3. حماية الشبكات</h3><h3>3.1 الجدران النارية والإعدادات الأساسية</h3>${fg('قاعدة السماح',['Internet','HTTPS TCP 443: ALLOW','FIREWALL','Internal web server'])}${fg('قاعدة الحجب',['Internet','Telnet TCP 23: BLOCK','FIREWALL','✖ stopped'])}<p><b>الجدار الناري:</b> عنصر تحكم مادي أو برمجي يصفي حركة مرور الشبكة وفقاً لقواعد أمنية. يسمح بالمرور الذي يلبي القواعد، ويحظر المرور الذي ينتهكها، ويستخدم معلومات مثل عناوين IP والبروتوكولات وأرقام المنافذ.</p>${tb(['قاعدة نموذجية','الإجراء','السبب'],['HTTPS الواردة (TCP 443)','ALLOW (سماح)','السماح بخدمة ويب معتمدة.'],['Telnet الواردة (TCP 23)','BLOCK (حظر)','منع تسجيل الدخول البعيد غير الآمن.'])}<h3>3.2 أنظمة كشف ومنع التسلل</h3><p><b>IDS:</b> يراقب نشاط الشبكة أو النظام بحثاً عن أحداث مريبة ويصدر تنبيهات. <b>IPS:</b> يكتشف النشاط المريب ويمكنه حظر حركة المرور الضارة تلقائياً.</p>${tb(['الخاصية','IDS','IPS'],['الإجراء الرئيسي','الكشف والتنبيه','الكشف والحظر'],['الموقع النموذجي','مسار المراقبة','مسار حركة المرور المباشر'])}<h3>4. تأمين الشبكات السلكية واللاسلكية</h3>${tb(['الشبكات السلكية','الشبكات اللاسلكية'],['تقييد الوصول المادي للمحولات والكابلات.','استخدام WPA3 أو WPA2 الآمن للواي فاي.'],['تعطيل منافذ المحول غير المستخدمة.','استخدام بيانات اعتماد قوية أو مصادقة المؤسسة.'],['استخدام التحكم في الوصول وتقسيم الشبكة.','تحديث نقاط الوصول وعزل شبكات الضيوف.'])}<h3>الملخص</h3>${bg('خريطة الملخص',[['التهديدات','برمجيات خبيثة، هندسة اجتماعية، DoS وDDoS'],['الجدار الناري','قواعد السماح والحظر'],['IDS / IPS','كشف وتنبيه / كشف وحظر'],['السلكية واللاسلكية','ضوابط مادية ومنافذ؛ WPA3']])}`,hwa:`<div class=co><b>الواجب:</b> اشرح أمن الشبكات وأنواع البرمجيات الخبيثة والهندسة الاجتماعية وهجمات DoS.</div><h3>إجابات أسئلة المراجعة</h3><ol><li>أمن الشبكات هو حماية أجهزة الشبكة وخدماتها وبياناتها من الوصول غير المصرح به. مهم لأنه يحمي المعلومات المنقولة ويحافظ على موثوقية الشبكة.</li><li>الفيروس يصيب ملفاً مضيفاً؛ الدودة تتكاثر ذاتياً وتنتشر؛ حصان طروادة يتنكر كبرنامج شرعي.</li><li>الهندسة الاجتماعية تتلاعب بالأشخاص للكشف عن معلومات. مثال شائع هو التصيد (Phishing).</li><li>هجوم <b>DDoS</b> يستخدم أجهزة متعددة لتعطيل خدمة.</li><li>الجدار الناري يصفي حركة المرور باستخدام قواعد. ALLOW يسمح، وBLOCK يحظر.</li><li>IDS يكتشف وينبه؛ IPS يكتشف ويمكنه حظر حركة المرور الضارة.</li><li>السلكية: تقييد الوصول المادي وتعطيل المنافذ غير المستخدمة. اللاسلكية: استخدام WPA3 وعزل شبكات الضيوف.</li></ol>`});
Object.assign(L[7],{ha:`<div class=co><b>الهدف من المحاضرة:</b> شرح المبادئ الأساسية لأمن التطبيقات، والتمييز بين حقن SQL والبرمجة عبر المواقع (XSS)، ووصف البرمجة الآمنة والدفاعية وطرق حماية البيانات (أثناء النقل والتخزين)، وشرح تشفير القرص الكامل (FDE) وممارسات أمن قواعد البيانات.</div>
<h3>1. أمن التطبيقات والبيانات</h3>${fg('بنية التطبيق الآمنة الأساسية',['WEB BROWSER: user request','APPLICATION SERVER: authentication, validation','DATABASE: controlled access'])}<p><b>أمن التطبيقات:</b> حماية تطبيقات البرمجيات من التهديدات والثغرات والإجراءات غير المصرح بها. <b>أمن البيانات:</b> حماية المعلومات من الوصول غير المصرح به أو التعديل أو الفقدان أو الكشف.</p><div class=co><b>فكرة رئيسية:</b> أمن التطبيقات يحمي كيفية معالجة البرمجيات للطلبات؛ وأمن البيانات يحمي المعلومات التي تخزنها البرمجيات وتنقلها.</div>
<h3>2. مبادئ أمن التطبيقات</h3><ul><li><b>التحقق من المدخلات:</b> فحص نوع المدخلات وطولها وتنسيقها قبل الاستخدام.</li><li><b>أقل صلاحية:</b> منح المستخدمين والبرامج فقط الصلاحيات التي يحتاجونها.</li><li><b>المصادقة الآمنة:</b> التحقق من هوية المستخدمين الذين يصلون إلى التطبيق.</li><li><b>معالجة الأخطاء الآمنة:</b> تجنب الكشف عن التفاصيل التقنية الحساسة في رسائل الخطأ.</li></ul>
<h3>2.1 حقن SQL (SQLi)</h3>${fg('كيف يعمل حقن SQL',['Attacker types crafted input','App inserts it into the SQL query','Modified query runs','Login bypassed'])}<div class=co><b>حقن SQL:</b> هجوم يتلاعب باستعلامات قاعدة البيانات عن طريق وضع مدخلات خبيثة في تطبيق يبني عبارات SQL غير آمنة.</div><p><b>الحماية الأساسية:</b> استخدام الاستعلامات المُعلّمة (Parameterized queries) لفصل أوامر SQL عن مدخلات المستخدم.</p><p><b>مثال (تجاوز تسجيل الدخول):</b> يدخل المهاجم <code>administrator'--</code> في حقل تسجيل الدخول. التطبيق يضع المدخل مباشرة في الاستعلام، فيتسبب تسلسل التعليق في تجاهل فحص كلمة المرور ويتم منح الوصول.</p>
<h3>2.2 البرمجة عبر المواقع (XSS)</h3><div class=co><b>XSS:</b> ثغرة ويب يجعل فيها المحتوى غير الموثوق المتصفح ينفذ سكريبت يتحكم فيه المهاجم في سياق موقع موثوق.</div><p><b>الحماية الأساسية:</b> استخدام ترميز المخرجات الواعي بالسياق (Context-aware output encoding) لعرض البيانات غير الموثوقة بأمان بدلاً من تنفيذها كسكريبت. واستخدام سياسة أمان المحتوى (CSP) كدفاع إضافي.</p>
<h3>3. حماية البيانات أثناء النقل والتخزين</h3><p><b>البيانات أثناء النقل:</b> المعلومات التي تنتقل بين الأجهزة عبر الشبكة. <b>البيانات المخزنة (في حالة السكون):</b> المعلومات المخزنة على الأجهزة أو الأقراص أو قواعد البيانات.</p>${tb(['حالة البيانات','طريقة الحماية','الغرض'],['أثناء النقل','TLS (مثل HTTPS)','حماية الاتصالات من الاعتراض والتلاعب.'],['في حالة السكون','تشفير التخزين','حماية البيانات المخزنة من القراءة غير المصرح بها.'])}<h3>3.1 تشفير القرص الكامل (FDE)</h3>${fg('تشفير القرص الكامل',['Lost device: disk stays encrypted','Cannot be read without the key','Correct credentials unlock it'])}<div class=co><b>FDE:</b> طريقة أمنية تشفّر البيانات على محرك الأقراص وتتطلب فتحاً مصرحاً به للوصول إلى المحتويات المحمية.</div><p><b>القيود:</b> FDE لا يمنع المهاجم من قراءة الملفات من خلال حساب مفتوح ومخترق بالفعل. ولا يحل محل النسخ الاحتياطية المنتظمة.</p>
<h3>3.2 ممارسات أمن قواعد البيانات</h3><ul><li><b>التحكم في الوصول:</b> السماح فقط للمستخدمين والأدوار المصرح لها.</li><li><b>أقل صلاحية:</b> منح فقط الصلاحيات اللازمة للمهمة.</li><li><b>الاستعلامات الآمنة:</b> استخدام الاستعلامات المُعلّمة لمنع حقن SQL.</li><li><b>التشفير:</b> حماية سجلات قواعد البيانات الحساسة أثناء الراحة وأثناء النقل.</li><li><b>النسخ الاحتياطي والاسترداد الآمن:</b> حماية نسخ النسخ الاحتياطي واختبار الاستعادة بانتظام.</li><li><b>المراقبة:</b> تسجيل ومراجعة نشاط قاعدة البيانات المهم.</li></ul><h3>الملخص</h3>${bg('خريطة الملخص',[['أمن التطبيقات','تحقق من المدخلات، أقل صلاحية، أخطاء آمنة'],['SQLi وXSS','استعلامات معلّمة؛ ترميز المخرجات وCSP'],['حماية البيانات','TLS في النقل؛ تشفير في السكون؛ FDE'],['أمن قواعد البيانات','وصول، استعلامات، تشفير، نسخ احتياطي، مراقبة']])}`,hwa:`<div class=co><b>الواجب:</b> اشرح الفرق بين SQLi وXSS وطرق الحماية، واذكر ممارسات أمن البيانات.</div><h3>إجابات أسئلة المراجعة</h3><ol><li><b>أمن التطبيقات</b> يحمي البرمجيات من التهديدات. <b>أمن البيانات</b> يحمي المعلومات من الوصول أو التعديل أو الكشف غير المصرح به.</li><li>أي اثنين من: التحقق من المدخلات، أقل صلاحية، مصادقة آمنة، معالجة آمنة للأخطاء.</li><li>حقن SQL يتلاعب باستعلامات قاعدة البيانات. الاستعلامات المُعلّمة تفصل أوامر SQL عن مدخلات المستخدم.</li><li>XSS يجعل المتصفح ينفذ سكريبت خبيث. ترميز المخرجات الواعي بالسياق يعرض البيانات بأمان.</li><li>البيانات أثناء النقل تنتقل عبر الشبكة وتُحمى بـTLS. البيانات المخزنة تُحمى بتشفير التخزين.</li><li>FDE يشفر البيانات على القرص. القيود: لا يوقف المهاجم الذي يمتلك حساباً مفتوحاً بالفعل.</li><li>التحكم في الوصول، أقل صلاحية، استعلامات آمنة، تشفير، نسخ احتياطي، مراقبة.</li></ol>`});

Object.assign(L[8],{ha:`<div class=co><b>الهدف من المحاضرة:</b> شرح دور إدارة الأمن السيبراني في حماية معلومات المؤسسة، والتمييز بين السياسات والإجراءات الأمنية، ووصف أنشطة إدارة الحوادث، والتمييز بين معيار ISO/IEC 27001 وإطار NIST CSF 2.0.</div>
<h3>1. السياسات والإجراءات الأمنية</h3><p><b>السياسة الأمنية:</b> قاعدة مكتوبة تحدد ما تتطلبه المؤسسة لحماية معلوماتها. <b>الإجراء الأمني:</b> تعليمات خطوة بخطوة تشرح كيف يجب على الموظفين اتباع سياسة الأمن.</p><div class=co><b>مثال: من يحق له تغيير درجات الطلبة؟</b><br>السياسة = <b>ماذا (WHAT)</b>: فقط موظفو التسجيل المصرح لهم يمكنهم تغيير درجة الطالب.<br>الإجراء = <b>كيف (HOW)</b>: 1. التحقق من هوية الموظف. 2. الحصول على الموافقة. 3. تسجيل التغيير في سجل.</div><p><b>عناصر السياسة الرئيسية:</b></p><ul><li><b>التحكم في الوصول:</b> تحديد من يمكنه استخدام الأنظمة أو البيانات الحساسة.</li><li><b>حماية البيانات:</b> شرح كيفية التعامل مع المعلومات المهمة وتخزينها.</li><li><b>الإبلاغ عن الحوادث:</b> إخبار المستخدمين بكيفية الإبلاغ عن الأحداث المريبة.</li><li><b>المراقبة والتدقيق:</b> مراجعة سجلات النشاط والامتثال.</li><li><b>التوعية الأمنية:</b> تدريب الموظفين على التعرف على التهديدات.</li></ul>
<h3>دورة تطوير السياسة (5 خطوات):</h3>${fg('دورة تطوير السياسة',['1 Set goals','2 Assess risk','3 Write rules','4 Apply and train','5 Review (repeat)'])}<ol><li><b>تحديد الأهداف:</b> تحديد ما يجب حمايته والنتائج الأمنية المرجوة.</li><li><b>تقييم المخاطر:</b> تحديد وتقييم التهديدات والثغرات والمخاطر.</li><li><b>كتابة القواعد:</b> تحديد وتوثيق السياسات والإجراءات الأمنية.</li><li><b>التطبيق والتدريب:</b> تنفيذ القواعد وتوفير التدريب على التوعية الأمنية.</li><li><b>المراجعة:</b> المراقبة والتدقيق ومراجعة السياسة وتحديثها حسب الحاجة.</li></ol>
<h3>2. الاستجابة للحوادث وإدارتها</h3><p><b>الحادث الأمني:</b> حدث يخترق أو يهدد المعلومات أو النظام، مثل إصابة ببرمجيات خبيثة أو سرقة بيانات اعتماد. <b>الاستجابة للحوادث:</b> الإجراءات المخططة للتحقيق في الحادث والحد من الضرر واستعادة الخدمات ومنع مشاكل مماثلة.</p><p><b>خطوات الاستجابة الست (تعليمية):</b></p>${fg('الاستجابة للحوادث',['1 Preparation','2 Identification','3 Containment','4 Eradication','5 Recovery','6 Lessons learned'])}<ol><li>التحضير (Preparation)</li><li>التحديد (Identification)</li><li>الاحتواء (Containment)</li><li>الاستئصال (Eradication)</li><li>التعافي (Recovery)</li><li>الدروس المستفادة (Lessons Learned)</li></ol><div class=co><b>ملاحظة NIST:</b> إرشادات NIST SP 800-61 Rev. 3 (2025) تدمج الاستجابة للحوادث مع إدارة مخاطر الأمن السيبراني. الخطوات الست المذكورة أعلاه هي أنشطة تعليمية مبسطة، وليست وظائف NIST CSF 2.0 الست الرسمية.</div>
<h3>3. المعايير والأطر الأمنية</h3>${bg('وظائف NIST CSF 2.0',[['GOVERN','Strategy, roles, oversight'],['IDENTIFY','Know systems and risks'],['PROTECT','Apply safeguards'],['DETECT','Recognize incidents'],['RESPOND','Manage incidents'],['RECOVER','Restore services']])}<p><b>ISO/IEC 27001:2022</b> هو معيار دولي يحدد متطلبات نظام إدارة أمن المعلومات (ISMS). يدير ISMS مخاطر أمن المعلومات من خلال السياسات والمسؤوليات والضوابط والتحسين المستمر. الشهادة اختيارية.</p><p><b>NIST CSF 2.0</b> هو إطار عمل مرن لتنظيم إدارة مخاطر الأمن السيبراني. وظائفه الست تعمل معاً بدلاً من اتباع تسلسل صارم.</p>${tb(['الوظيفة','الوصف'],['GOVERN','الاستراتيجية والأدوار والرقابة'],['IDENTIFY','معرفة أنظمتك ومخاطرك'],['PROTECT','تطبيق الضوابط'],['DETECT','التعرف على الحوادث المحتملة'],['RESPOND','إدارة الحوادث المؤكدة'],['RECOVER','استعادة الخدمات الأساسية'])}<h3>الملخص</h3><ul><li>السياسة تحدد القاعدة؛ والإجراء يشرح الخطوات.</li><li>الاستجابة للحوادث تحد من الضرر وتستعيد الأنظمة.</li><li>ISO/IEC 27001 يركز على ISMS؛ NIST CSF 2.0 ينظم إدارة المخاطر في 6 وظائف.</li></ul>`,hwa:`<div class=co><b>الواجب:</b> اشرح الفرق بين السياسة والإجراء واستجابة الحوادث.</div><h3>إجابات أسئلة المراجعة</h3><ol><li>إدارة الأمن السيبراني تنظم الأشخاص والسياسات والأنشطة الأمنية لتقليل المخاطر.</li><li>السياسة تحدد ماذا (WHAT) هو مطلوب؛ الإجراء يحدد كيف (HOW) يتم اتباعه.</li><li>أي ثلاثة: التحكم في الوصول، حماية البيانات، الإبلاغ عن الحوادث، المراقبة والتدقيق، التوعية الأمنية.</li><li>فريق تقنية المعلومات يتحقق من التنبيه، يعزل الجهاز، ينظفه، يستعيد البيانات الموثوقة، ويسجل الدرس المستفاد.</li><li>ISMS تعني نظام إدارة أمن المعلومات.</li><li>GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER.</li><li>ISO/IEC 27001 هو معيار متطلبات ISMS مع شهادة اختيارية؛ NIST CSF 2.0 هو إطار إدارة مخاطر مرن بدون شهادة رسمية.</li></ol>`});
Object.assign(L[9],{ha:`<div class=co><b>الهدف من المحاضرة:</b> تعريف أمن السحابة وتحدياته، وشرح الضوابط والمسؤولية المشتركة، وتحديد مخاطر أمن إنترنت الأشياء (IoT) والممارسات الوقائية، والتعرف على التحديات المستقبلية لأمن المعلومات.</div>
<h3>1. أمن السحابة: التحديات والحلول</h3><div class=co><b>أمن السحابة:</b> حماية البيانات والتطبيقات والخدمات المستضافة سحابياً من الوصول غير المصرح به والكشف والتعطيل.</div><p><b>التحديات الشائعة:</b></p><ul><li><b>الإعدادات الخاطئة:</b> الإعدادات غير الصحيحة قد تكشف البيانات أو الخدمات.</li><li><b>ضعف التحكم في الوصول:</b> الحسابات المسروقة أو الصلاحيات المفرطة تسمح بإساءة الاستخدام.</li><li><b>تعرض البيانات:</b> قد يتم الوصول إلى الملفات الحساسة دون إذن.</li><li><b>محدودية الرؤية:</b> فقدان السجلات والتنبيهات يؤخر الكشف عن التهديدات.</li></ul>${tb(['التحدي الشائع','الضابط الموصى به'],['تخزين سحابي مكشوف للعامة','تقييد أذونات الوصول'],['بيانات اعتماد مسروقة أو ضعيفة','استخدام MFA وأقل صلاحية'],['تعرض البيانات الحساسة','تشفير البيانات وتقييد المشاركة'],['نشاط مريب غير مكتشف','تمكين التسجيل والمراقبة'])}<h3>المسؤولية المشتركة في أمن السحابة</h3>${bg('من يحمي ماذا',[['Cloud provider','Data centers, physical hardware, infrastructure'],['Cloud customer','Account permissions, data, settings']])}<p>أمن السحابة مشترك بين مزود الخدمة والعميل. المزود يحمي البنية التحتية الأساسية؛ والعميل يحمي بياناته ووصول المستخدمين والإعدادات.</p><p><b>الممارسات الأساسية:</b> مصادقة قوية (MFA)؛ أقل صلاحية؛ إعداد آمن (تقييد الوصول العام)؛ حماية البيانات (تشفير ونسخ احتياطي)؛ المراقبة (مراجعة السجلات).</p>
<h3>2. أمن إنترنت الأشياء (IoT)</h3>${fg('شبكة IoT آمنة مبسطة',['IoT devices: camera, sensor, lock','Router / firewall: separate networks','College network: records, admin'])}<p><b>إنترنت الأشياء (IoT):</b> أجهزة مادية تجمع أو تعالج أو تتبادل البيانات عبر اتصالات الشبكة. <b>أمن IoT:</b> حماية الأجهزة المتصلة واتصالاتها.</p><p><b>المخاطر الشائعة:</b></p><ul><li><b>كلمات مرور افتراضية أو ضعيفة:</b> قد يصل المهاجمون إلى الجهاز.</li><li><b>برامج ثابتة قديمة:</b> الثغرات غير المصلحة يمكن استغلالها.</li><li><b>تعرض الخصوصية:</b> الكاميرات والمستشعرات قد تكشف بيانات حساسة.</li><li><b>إساءة استخدام شبكة الروبوتات (Botnet):</b> الأجهزة المصابة قد تستخدم في هجمات DDoS.</li></ul><p><b>الممارسات الأساسية:</b> كلمات مرور فريدة وتغيير الإعدادات الافتراضية. تثبيت تحديثات الأمان. فصل أجهزة IoT عن الشبكات الحساسة. تقييد الوصول وحماية الاتصالات.</p>
<h3>3. التحديات المستقبلية في أمن المعلومات</h3>${bg('التحديات المستقبلية والاستجابات',[['AI-assisted scams','Verify identities'],['Connected devices','Inventory and updates'],['Quantum risk','Post-quantum cryptography'],['Supply chains','Review vendors and software']])}${tb(['التحدي','الوصف','الاستجابة'],['تهديدات بمساعدة الذكاء الاصطناعي','تصيد وانتحال هوية أكثر إقناعاً.','التحقق من الهويات'],['نمو الأجهزة المتصلة','المزيد من الأجهزة يزيد الأنظمة المراد حمايتها.','الجرد والتحديثات'],['مخاطر الحوسبة الكمية','الحواسيب الكمية المستقبلية قد تهدد التشفير العام الحالي.','التخطيط للتشفير ما بعد الكمي'],['مخاطر السحابة وسلسلة التوريد','الاعتماد على برامج وخدمات خارجية قد تتعرض للاختراق.','مراجعة البائعين والبرمجيات'])}<h3>الملخص</h3><ul><li>أمن السحابة يحمي البيانات والخدمات من التعرض والتعطيل.</li><li>مزودو السحابة وعملاؤهم يتشاركون مسؤوليات الأمن.</li><li>أجهزة IoT تتطلب تحكماً قوياً في الوصول وتحديثات وفصلاً للشبكة.</li><li>المخاطر المستقبلية تشمل هجمات الذكاء الاصطناعي، والحوسبة الكمية، وسلسلة التوريد.</li></ul><div class=co>نهاية هذه الدورة ليست نهاية التعلم. استمر في الاستكشاف، وفكر بشكل نقدي، واستخدم معرفتك بمسؤولية لبناء عالم رقمي أكثر أماناً.</div>`,hwa:`<div class=co><b>الواجب:</b> اشرح أمن السحابة، IoT، والتحديات المستقبلية.</div><h3>إجابات أسئلة المراجعة</h3><ol><li>أمن السحابة هو حماية البيانات والتطبيقات والخدمات السحابية من الوصول غير المصرح به والكشف والتعطيل.</li><li>أي ثلاثة: إعدادات خاطئة، ضعف التحكم في الوصول، تعرض البيانات، محدودية الرؤية.</li><li>الأمن السحابي مشترك: المزود يحمي البنية التحتية، والعميل يحمي بياناته ووصول المستخدمين والإعدادات.</li><li>IoT: أجهزة مادية تجمع أو تتبادل البيانات عبر الشبكة. أمثلة: كاميرات ذكية ومستشعرات.</li><li>استخدام كلمات مرور فريدة وتغيير الافتراضية؛ تثبيت التحديثات؛ فصل أجهزة IoT عن الشبكات الحساسة.</li><li>أي ثلاثة: تهديدات الذكاء الاصطناعي، نمو الأجهزة، مخاطر الحوسبة الكمية، مخاطر سلسلة التوريد.</li><li>الحواسيب الكمية قد تهدد التشفير العام الحالي، لذا يجب التخطيط لتحسين التشفير (التشفير ما بعد الكمي).</li></ol>`});
